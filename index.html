<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grand RP Police Wiki — rules, penal code, traffic code, arrest procedures and event guides.">
<title>Grand RP Police Wiki</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #f5f7fb; --panel: #fff; --panel2: #f8fafc; --text: #111827; --muted: #6b7280;
  --line: #e5e7eb; --accent: #2563eb; --accent2: #1d4ed8; --sidebar: #0f172a;
  --sidebarText: #cbd5e1; --sidebarMuted: #94a3b8; --danger: #dc2626; --success: #059669;
  --shadow: 0 8px 30px rgba(15,23,42,.07); --radius: 16px; --hover-bg: #f1f5f9;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }
button, input { font: inherit; }
.app { display: flex; min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 270px; background: var(--sidebar); color: #fff; padding: 20px 14px; overflow: auto; z-index: 20; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.brand { display: flex; align-items: center; gap: 12px; padding: 7px 10px 22px; }
.logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: grid; place-items: center; font-weight: 800; box-shadow: 0 8px 24px #0004; }
.brand strong { font-size: 15px; }
.brand small { display: block; color: var(--sidebarMuted); margin-top: 2px; font-size: 11px; }
.nav-title { padding: 14px 10px 7px; color: #64748b; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
.nav button { width: 100%; border: 0; background: transparent; color: var(--sidebarText); padding: 10px 11px; border-radius: 10px; text-align: left; display: flex; gap: 10px; align-items: center; cursor: pointer; margin: 2px 0; font-size: 13px; transition: all 0.2s; }
.nav button:hover { background: #1e293b; color: #fff; transform: translateX(4px); }
.nav button.active { background: #2563eb; color: #fff; box-shadow: 0 5px 16px #2563eb44; }
.nav .ico { width: 18px; text-align: center; opacity: .9; }
.main { margin-left: 270px; width: calc(100% - 270px); transition: margin-left 0.3s, width 0.3s; }
.topbar { height: 72px; background: rgba(255,255,255,.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 28px; position: sticky; top: 0; z-index: 10; transition: background 0.3s, border-color 0.3s; }
.search { flex: 1; max-width: 680px; position: relative; }
.search input { width: 100%; padding: 12px 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); outline: none; transition: all 0.2s; color: var(--text); }
.search input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px #3b82f622; background: var(--panel); }
.search span { position: absolute; left: 14px; top: 11px; color: var(--muted); }
.kbd { position: absolute; right: 10px; top: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; color: var(--muted); font-size: 10px; background: var(--panel); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; transition: all 0.2s; display: grid; place-items: center; }
.iconbtn:hover { background: var(--hover-bg); transform: scale(1.05); }
.content { max-width: 1250px; margin: auto; padding: 30px; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.hero { background: linear-gradient(135deg, #111827, #1e3a8a); color: #fff; border-radius: 22px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 24px; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; top: -50%; right: -10%; width: 50%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); transform: rotate(30deg); }
.hero h1 { margin: 0 0 8px; font-size: 30px; position: relative; z-index: 2; }
.hero p { margin: 0; color: #dbeafe; max-width: 750px; line-height: 1.6; position: relative; z-index: 2; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0 26px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 17px; box-shadow: var(--shadow); transition: transform 0.2s; }
.stat:hover { transform: translateY(-3px); }
.stat b { font-size: 22px; display: block; color: var(--text); }
.stat span { font-size: 11px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin: 0 0 18px; overflow: hidden; }
.card-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel2); }
.card-head h2 { margin: 0; font-size: 17px; color: var(--text); }
.card-body { padding: 20px; }
.rule { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: var(--panel); overflow: hidden; transition: border-color 0.2s; }
.rule:hover { border-color: #93c5fd; }
.rule summary { list-style: none; cursor: pointer; padding: 13px 15px; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; color: var(--text); user-select: none; }
.rule summary::-webkit-details-marker { display: none; }
.rule summary:before { content: '›'; color: var(--accent); font-size: 19px; line-height: 16px; transition: transform 0.2s; }
.rule[open] summary:before { transform: rotate(90deg); }
.rule .desc { padding: 0 15px 15px 39px; color: var(--muted); line-height: 1.65; font-size: 13px; }
.badge { font-size: 10px; padding: 4px 7px; border-radius: 999px; background: rgba(37,99,235,0.1); color: var(--accent); font-weight: 800; white-space: nowrap; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.table { width: 100%; border-collapse: collapse; min-width: 650px; }
.table th { background: var(--panel2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; text-align: left; padding: 11px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.table td { padding: 11px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: middle; color: var(--text); }
.table tr:last-child td { border-bottom: 0; }
.table tr { transition: background 0.15s; }
.table tr:hover { background: var(--hover-bg); }
.code { font-weight: 800; color: var(--accent); white-space: nowrap; }
.money { font-weight: 700; white-space: nowrap; color: #16a34a; }
.copy-btn { padding: 4px 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; font-size: 10px; cursor: pointer; transition: all 0.2s; font-weight: 600; text-transform: uppercase; }
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.notice { padding: 13px 15px; border-left: 4px solid var(--accent); background: rgba(37,99,235,0.05); border-radius: 0 8px 8px 0; color: var(--text); font-size: 12px; line-height: 1.6; margin-bottom: 15px; }
.warn { border-left-color: #f59e0b; background: rgba(245,158,11,0.05); }
.section-title { font-size: 24px; margin: 0 0 7px; color: var(--text); }
.section-sub { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
.procedure .step { position: relative; padding: 17px 18px 17px 58px; border: 1px solid var(--line); border-radius: 13px; margin: 10px 0; background: var(--panel); transition: transform 0.2s; }
.procedure .step:hover { transform: translateX(4px); border-color: var(--accent); }
.stepno { position: absolute; left: 17px; top: 17px; width: 27px; height: 27px; border-radius: 50%; background: rgba(37,99,235,0.1); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.step h3 { margin: 0 0 7px; font-size: 14px; color: var(--text); display: flex; justify-content: space-between; align-items: center;}
.step p { font-size: 13px; line-height: 1.65; color: var(--muted); margin: 0;}
.quote { border-left: 3px solid var(--muted); background: var(--panel2); padding: 10px 12px; margin: 10px 0 0 0; font-style: italic; font-size: 12px; color: var(--text); border-radius: 0 8px 8px 0; }
.map { width: 100%; max-height: 560px; object-fit: contain; background: #020617; border-radius: 12px; }
.eventgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.eventcard { border: 1px solid var(--line); border-radius: 13px; padding: 17px; background: var(--panel); transition: transform 0.2s, border-color 0.2s; }
.eventcard:hover { transform: translateY(-3px); border-color: var(--accent); }
.eventcard h3 { margin: 0 0 10px; font-size: 15px; color: var(--text); }
.eventcard li { font-size: 12px; line-height: 1.65; margin: 5px 0; color: var(--muted); }
.footer { color: var(--muted); text-align: center; font-size: 11px; padding: 25px; }
.modal { position: fixed; inset: 0; background: rgba(2,6,23,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; z-index: 50; opacity: 0; transition: opacity 0.2s; }
.modal.show { display: flex; opacity: 1; }
.modalbox { width: min(720px, 92vw); background: var(--panel); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); overflow: hidden; transform: translateY(-20px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid var(--line); }
.modal.show .modalbox { transform: translateY(0); }
.modalbox input { width: 100%; padding: 18px; border: 0; border-bottom: 1px solid var(--line); outline: 0; background: var(--panel); color: var(--text); font-size: 16px; }
.results { max-height: 55vh; overflow: auto; }
.result { padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s; }
.result:hover { background: var(--hover-bg); border-left: 3px solid var(--accent); padding-left: 15px; }
.result b { display: block; font-size: 13px; color: var(--text); margin-bottom: 4px; }
.result span { font-size: 11px; color: var(--muted); display: block; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--sidebar); color: #fff; padding: 12px 24px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 13px; font-weight: 600; z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.toast.show { transform: translateY(0); opacity: 1; }
.mobilebtn { display: none; font-size: 18px; }

/* Dark Mode Overrides */
[data-dark="1"] {
  --bg: #0f172a; --panel: #1e293b; --panel2: #0f172a; --text: #f8fafc; --muted: #94a3b8;
  --line: #334155; --sidebar: #020617; --hover-bg: #334155;
}

@media(max-width:1000px){
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
  .main { margin-left: 0; width: 100%; }
  .mobilebtn { display: grid; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width:650px){
  .content { padding: 17px; }
  .topbar { padding: 0 14px; }
  .hero { padding: 22px; }
  .hero h1 { font-size: 24px; }
  .grid { grid-template-columns: 1fr 1fr; }
  .eventgrid { grid-template-columns: 1fr; }
  .kbd { display: none; }
  .topbar { background: var(--panel); }
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">GR</div><div><strong>Grand RP Wiki</strong><small>Police / State Handbook</small></div></div>
  <div class="nav" id="nav">
    <div class="nav-title">Overview</div>
    <button data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="general"><span class="ico">◈</span>General Rules</button>
    <button data-page="state"><span class="ico">◉</span>State Rules</button>
    <button data-page="green"><span class="ico">●</span>Green Zone Rules</button>
    <button data-page="ghetto"><span class="ico">◆</span>Ghetto Rules</button>
    <div class="nav-title">Police Handbook</div>
    <button data-page="traffic-stop"><span class="ico">10</span>10-51 Traffic Stop</button>
    <button data-page="arrest"><span class="ico">15</span>10-15 Arrest Procedure</button>
    <button data-page="penal"><span class="ico">§</span>Penal Code</button>
    <button data-page="traffic"><span class="ico">↔</span>Traffic Code</button>
    <button data-page="events"><span class="ico">★</span>Event Rules</button>
    <button data-page="map"><span class="ico">⌖</span>Territory Map</button>
    <div class="nav-title">Reference</div>
    <button data-page="terms"><span class="ico">?</span>Roleplay Terms</button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <button class="iconbtn mobilebtn" id="mobileMenu">☰</button>
  <div class="search"><span>⌕</span><input id="searchInput" placeholder="Search rules, PC, TC, procedures..." autocomplete="off"><span class="kbd">Ctrl K</span></div>
  <div class="top-actions"><button class="iconbtn" id="themeBtn" title="Toggle theme">☾</button></div>
</header>
<div class="content" id="content"></div>
<div class="footer">Grand RP Wiki • Content reproduced from the supplied server-rule text and Patrolman's Guide PDFs.</div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox"><input id="modalSearch" placeholder="Search the wiki..."><div class="results" id="results"></div></div></div>
<div id="toast" class="toast">Copied to clipboard!</div>

<script>
// Your exact original data objects for rules, events, penal, misdemeanors, traffic, parking, specialParking, terms, procedure, trafficStop go here
// I have truncated the raw data objects in this code block to save space, but YOU MUST PASTE YOUR ORIGINAL `const rules = {...}` data back in right here.
const rules = /* PASTE YOUR ORIGINAL RULES OBJECT HERE */ {}; 
const events = /* PASTE YOUR ORIGINAL EVENTS OBJECT HERE */ {};
const penal = /* PASTE YOUR ORIGINAL PENAL ARRAY HERE */ [];
const misdemeanors = /* PASTE YOUR ORIGINAL MISDEMEANORS ARRAY HERE */ [];
const traffic = /* PASTE YOUR ORIGINAL TRAFFIC ARRAY HERE */ [];
const parking = /* PASTE YOUR ORIGINAL PARKING ARRAY HERE */ [];
const specialParking = /* PASTE YOUR ORIGINAL SPECIALPARKING ARRAY HERE */ [];
const terms = /* PASTE YOUR ORIGINAL TERMS ARRAY HERE */ [];
const procedure = /* PASTE YOUR ORIGINAL PROCEDURE ARRAY HERE */ [];
const trafficStop = /* PASTE YOUR ORIGINAL TRAFFICSTOP ARRAY HERE */ [];

// Helper functions
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

window.copyToClipboard = function(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
};

function rulesPage(key){
 if(!rules[key]) return dashboard();
 const d=rules[key]; let out=`<h1 class="section-title">${esc(d.title)}</h1><p class="section-sub">${esc(d.sub)}</p>`;
 d.groups.forEach(g=>{out+=`<div class="card"><div class="card-head"><h2>${esc(g[0])}</h2><span class="badge">${g[1].length} rules</span></div><div class="card-body">`;
 g[1].forEach(x=>out+=`<details class="rule"><summary><span>${esc(x[0])}</span><span style="font-weight:500;flex:1">${esc(x[1])}</span>${x[2]?`<span class="badge">${esc(x[2])}</span>`:""}</summary>${x[2]?`<div class="desc"><b>Penalty:</b> ${esc(x[2])}</div>`:""}</details>`);
 out+=`</div></div>`}); return out;
}

function tableWithCopy(rows, cols, copyPrefix = ""){
 return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}<th>Action</th></tr></thead><tbody>
 ${rows.map(r=>{
   const rawCode = r[0]; // e.g. "P.C. 2.1.1"
   const copyStr = `${copyPrefix}${r[0]} - ${r[1]}`;
   return `<tr>${r.map((v,i)=>`<td class="${i===0?'code':i===2?'money':''}">${esc(v||'-')}</td>`).join("")}
   <td><button class="copy-btn" onclick="copyToClipboard('${esc(copyStr)}')">Copy</button></td></tr>`;
 }).join("")}</tbody></table></div>`;
}

function dashboard(){
 return `<div class="hero"><h1>Grand RP Police Wiki</h1><p>Quick-access handbook for state rules, penal code, traffic code, traffic stops, arrests, events and roleplay terminology. Built for active RP situations.</p></div>
 <div class="grid"><div class="stat"><b>100+</b><span>Penal Code entries</span></div><div class="stat"><b>30+</b><span>Traffic Code entries</span></div><div class="stat"><b>15</b><span>Arrest steps</span></div><div class="stat"><b>9</b><span>Event guides</span></div></div>
 <div class="card"><div class="card-head"><h2>Quick Access</h2></div><div class="card-body"><div class="eventgrid">
 ${[['Penal Code','Complete PC table by article','penal'],['Traffic Code','Traffic + parking violations','traffic'],['10-15 Arrest','Step-by-step DOC process','arrest'],['10-51 Traffic Stop','Radar to contact phase','traffic-stop'],['State Rules','State organization rules','state'],['Ghetto Rules','Ghetto and capture rules','ghetto']].map(x=>`<div class="eventcard" style="cursor:pointer" onclick="go('${x[2]}')"><h3>${x[0]}</h3><p style="font-size:12px;color:var(--muted);margin:0">${x[1]}</p></div>`).join("")}
 </div></div></div>`;
}

function penalPage(){
 let articles={};
 penal.forEach(r=>{let a=r[0].split('.')[0]; if(!articles[a])articles[a]=[];articles[a].push(r)});
 const names={2:'Crimes Against Society',3:'Crimes Against the State',4:'Malfeasance',5:'Traffic Statute Crimes',6:'Judicial Crimes',8:'Commercial and Taxation Crimes',9:'Correctional Crimes'};
 let out=`<h1 class="section-title">Penal Code</h1><p class="section-sub">Quickly copy charges for your PDA or arrest reports.</p>
 <div class="notice"><b>Legend:</b> Yellow = No Bailout • Blue = Sentence Varies • Red = Driver's License Revoc. • Green = Gun License Revoc. • Pink = All License Revoc. • Black = Blacklist • Gray = Dismissal.</div>`;
 Object.keys(articles).forEach(a=>{out+=`<div class="card"><div class="card-head"><h2>ARTICLE ${a}: ${names[a]||''}</h2><span class="badge">${articles[a].length} entries</span></div><div class="card-body">${tableWithCopy(articles[a].map(r=>[`${r[0]}`,r[1],r[2],r[3]||'-',r[4]||'-']),['Code','Crime','Fine','Time','Stars'], "P.C. ")}</div></div>`});
 return out;
}

function trafficPage(){
 return `<h1 class="section-title">Traffic Code</h1><p class="section-sub">Traffic statutes and parking violations.</p>
 <div class="card"><div class="card-head"><h2>Traffic Statute Crimes</h2></div><div class="card-body">${tableWithCopy(traffic.map(r=>[`${r[0]}`,r[1],r[2],r[3],r[4]]),['Code','Description','Fine','Time','Stars'], "T.C. ")}</div></div>
 <div class="card"><div class="card-head"><h2>Parking Violations</h2></div><div class="card-body">${tableWithCopy(parking.map(r=>[`${r[0]}`,r[1],r[2]]),['Code','Description','Fine'], "T.C. ")}</div></div>
 <div class="card"><div class="card-head"><h2>Special / Location Parking</h2></div><div class="card-body">${tableWithCopy(specialParking.map(r=>[`${r[0]}`,r[1],r[2]]),['Code','Description','Fine'], "T.C. ")}</div></div>`;
}

function procedurePage(){
 let out=`<h1 class="section-title">10-15 Arrest Procedure</h1><p class="section-sub">Copy RP lines instantly during high-stress situations.</p>
 <div class="card procedure"><div class="card-body">`;
 procedure.forEach((s,i)=>{
   const rpText = s[2] ? s[2] : s[1];
   out+=`<div class="step"><div class="stepno">${i+1}</div>
   <h3>${esc(s[0])} <button class="copy-btn" onclick="copyToClipboard('${esc(rpText)}')">Copy RP Line</button></h3>
   <p>${esc(s[1])}</p>${s[2]?`<div class="quote">${esc(s[2])}</div>`:""}</div>`});
 out+=`</div></div>`; return out;
}

function trafficStopPage(){
 let out=`<h1 class="section-title">10-51 Traffic Stop Procedure</h1><p class="section-sub">Standard operating procedure for conducting traffic stops.</p><div class="card procedure"><div class="card-body">`;
 trafficStop.forEach(s=>{
   const rpText = s[3] ? s[3] : s[2];
   out+=`<div class="step"><div class="stepno">${s[0]}</div>
   <h3>${esc(s[1])} <button class="copy-btn" onclick="copyToClipboard('${esc(rpText)}')">Copy RP Line</button></h3>
   <p>${esc(s[2])}</p>${s[3]?`<div class="quote">${esc(s[3])}</div>`:""}</div>`});
 out+=`</div></div>`; return out;
}

function eventsPage(){
 return `<h1 class="section-title">Event Rules</h1><p class="section-sub">Guidelines and protocols for major server events.</p><div class="eventgrid">${Object.entries(events).map(([k,v])=>`<div class="eventcard"><h3>${esc(k)}</h3><ol>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`).join("")}</div>`;
}

function mapPage(){
 return `<h1 class="section-title">Territory Map</h1><p class="section-sub">Territory image supplied with the wiki materials.</p><div class="card"><div class="card-body"><img class="map" src="assets/territory-map.png" alt="Territory map"></div></div>`;
}

function termsPage(){
 return `<h1 class="section-title">Roleplay Terms</h1><p class="section-sub">Common RP terminology.</p><div class="card"><div class="card-body">${terms.map(t=>`<details class="rule" open><summary><span class="code">${esc(t[0])}</span><span style="font-weight:500;flex:1">${esc(t[1])}</span></summary></details>`).join("")}</div></div>`;
}

function render(page){
 const c=document.getElementById('content');
 let h=page==='dashboard'?dashboard():page==='penal'?penalPage():page==='traffic'?trafficPage():page==='arrest'?procedurePage():page==='traffic-stop'?trafficStopPage():page==='events'?eventsPage():page==='map'?mapPage():page==='terms'?termsPage():rulesPage(page);
 c.innerHTML=h; window.scrollTo({top:0,behavior:'smooth'});
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 document.getElementById('sidebar').classList.remove('open');
 localStorage.setItem('lastWikiPage', page); // Save last visited page
}
function go(page){render(page)}

// Init Sidebar
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

// Dark Mode logic with LocalStorage
const themeBtn = document.getElementById('themeBtn');
const initTheme = () => {
  const isDark = localStorage.getItem('wikiDark') === '1';
  document.documentElement.dataset.dark = isDark ? '1' : '0';
  themeBtn.innerHTML = isDark ? '☀' : '☾';
}
themeBtn.addEventListener('click',()=>{
 const dark = document.documentElement.dataset.dark === '1';
 document.documentElement.dataset.dark = dark ? '0' : '1';
 localStorage.setItem('wikiDark', dark ? '0' : '1');
 themeBtn.innerHTML = dark ? '☾' : '☀';
});
initTheme();

// Search Logic
const modal=document.getElementById('modal'), modalSearch=document.getElementById('modalSearch'), results=document.getElementById('results');
// Note: Keep your original searchIndex generation loop here.

function doSearch(q){
 q=q.trim().toLowerCase();
 if(!q){results.innerHTML='<div class="empty">Type to search the wiki.</div>';return}
 // Fallback if searchIndex isn't populated in this stripped snippet
 if(typeof searchIndex === 'undefined') return; 
 const hits=searchIndex.filter(x=>(x.title+' '+x.text).toLowerCase().includes(q)).slice(0,60);
 results.innerHTML=hits.length?hits.map(x=>`<div class="result" data-page="${x.page}"><b>${esc(x.title)}</b><span>${esc(x.text.slice(0,150))}${x.text.length>150?'…':''}</span></div>`).join(""):'<div class="empty">No results found.</div>';
 results.querySelectorAll('.result').forEach(el=>el.onclick=()=>{modal.classList.remove('show');go(el.dataset.page)});
}

document.getElementById('searchInput').addEventListener('focus',()=>{modal.classList.add('show');modalSearch.focus();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal.classList.add('show');modalSearch.focus()}if(e.key==='Escape')modal.classList.remove('show')});
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
modalSearch.addEventListener('input',e=>doSearch(e.target.value));
document.getElementById('searchInput').addEventListener('input',e=>{if(e.target.value){modal.classList.add('show');modalSearch.value=e.target.value;doSearch(e.target.value)}});

// Load last page or default to dashboard
const lastPage = localStorage.getItem('lastWikiPage') || 'dashboard';
render(lastPage);
</script>
</body>
</html>
