<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f8fafc; --panel: #ffffff; --line: #e2e8f0; --sidebar: #ffffff; --sidebar-hover: #f1f5f9;
  --text-main: #0f172a; --text-muted: #64748b; --accent: #0f172a; --primary: #3b82f6;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
  --radius: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-main); font-size: 14px; overflow-x: hidden; }
button, input { font: inherit; outline: none; }

.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
.brand { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid var(--line); }
.logo { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #1e293b, #0f172a); color: white; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.brand-text { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.nav-section { padding: 16px 12px; overflow-y: auto; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; color: var(--text-muted); cursor: pointer; transition: 0.2s; font-weight: 500; font-size: 13px; margin-bottom: 2px; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text-main); }
.nav-item.active { background: #f1f5f9; color: var(--text-main); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

/* Organizations Menu */
.org-menu { padding-left: 32px; margin-bottom: 8px; display: none; flex-direction: column; gap: 2px; }
.org-menu.open { display: flex; }
.org-item { font-size: 12px; padding: 8px 12px; color: var(--text-muted); cursor: pointer; border-radius: 6px; font-weight: 500; transition: 0.2s; }
.org-item:hover { background: var(--sidebar-hover); color: var(--text-main); }
.org-item.active { background: rgba(59,130,246,0.1); color: var(--primary); font-weight: 600; }

/* Main Area */
.main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { height: 60px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 40; }
.breadcrumb { font-weight: 600; font-size: 16px; color: var(--text-main); }
.topbar-actions { display: flex; align-items: center; gap: 16px; }
.clock-display { font-weight: 600; font-size: 13px; color: var(--text-main); background: #f1f5f9; padding: 6px 12px; border-radius: 6px; font-variant-numeric: tabular-nums; }

.content { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Universal UI Components */
.card, .article-group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow-sm); overflow: hidden; }
.card-body { padding: 24px; }
.hero { margin-bottom: 30px; }
.hero h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
.hero p { margin: 0; color: var(--text-muted); font-size: 15px; line-height: 1.5; }
.btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text-main); transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: #f8fafc; }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: #2563eb; }

/* Sub Tabs & Toolbars */
.toolbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; background: var(--panel); padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.sub-tabs { display: flex; background: #f1f5f9; padding: 4px; border-radius: 8px; }
.sub-tab { padding: 6px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; color: var(--text-muted); transition: 0.2s; border: none; background: transparent; }
.sub-tab.active { background: var(--panel); color: var(--text-main); box-shadow: var(--shadow-sm); }

/* Smart Cart / Summary Panel */
.summary-panel { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm); position: sticky; top: 76px; z-index: 30; gap: 32px; }
.summary-block { display: flex; flex-direction: column; gap: 4px; }
.summary-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.summary-value { font-size: 18px; font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }
.summary-actions { margin-left: auto; display: flex; gap: 12px; }

/* Data Tables */
.article-header { padding: 16px 20px; background: #f8fafc; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; cursor: pointer; }
.table { width: 100%; border-collapse: collapse; text-align: left; }
.table th { padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; background: var(--panel); }
.table td { padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
.table tr { transition: background 0.15s; }
.table tr:hover { background: #f8fafc; }
.table tr.selected { background: rgba(59,130,246,0.05); }

/* Copy Row & Clickables */
.copy-row { cursor: pointer; position: relative; }
.copy-row:hover td.cmd-text { color: var(--primary); font-family: monospace; font-weight: 600; }
.cb-custom { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 4px; display: grid; place-items: center; background: var(--panel); }
.table tr.selected .cb-custom { background: var(--primary); border-color: var(--primary); }
.table tr.selected .cb-custom::after { content: '✓'; color: white; font-size: 12px; font-weight: 800; }
.tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 8px; }
.tag-red { background: #fee2e2; color: #dc2626; border: 1px solid #f87171; }
.tag-yellow { background: #fef3c7; color: #d97706; border: 1px solid #fbbf24; }

/* Arrest Procedure */
.step { border-left: 2px solid var(--primary); padding-left: 20px; margin-bottom: 24px; position: relative; }
.step::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--panel); }
.step h3 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.step p { margin: 0; color: var(--text-muted); line-height: 1.6; }
.quote { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-family: monospace; color: var(--accent); font-weight: 600; }

/* Ticketing Tool */
.dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 60px 20px; text-align: center; color: var(--text-muted); cursor: pointer; background: #f8fafc; transition: 0.2s; }
.dropzone.dragover { border-color: var(--primary); background: rgba(59,130,246,0.05); }

/* Toast */
.toast { position: fixed; bottom: 32px; right: 32px; background: var(--text-main); color: white; padding: 14px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100; transform: translateY(100px); opacity: 0; transition: 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }

@media(max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .main { margin-left: 0; }
  .summary-panel { flex-wrap: wrap; top: 60px; }
  .toolbar-row { flex-direction: column; align-items: flex-start; }
}
</style>

// --- LOGIC: SMART CALCULATOR ---
let selectedCharges = [];

function toggleCharge(code, reason, fine, time, stars, trElement) {
  const index = selectedCharges.findIndex(c => c.code === code);
  if(index > -1) {
    selectedCharges.splice(index, 1);
    trElement.classList.remove('selected');
  } else {
    selectedCharges.push({code, reason, fine, time, stars});
    trElement.classList.add('selected');
  }
  updateSummaryPanel();
}

function updateSummaryPanel() {
  let totalFine = 0; let totalTime = 0; let totalStars = 0;
  selectedCharges.forEach(c => { totalFine += c.fine; totalTime += c.time; totalStars += c.stars; });
  if (totalStars > 5) totalStars = 5;

  document.getElementById('sum-fines').textContent = "$" + totalFine.toLocaleString();
  document.getElementById('sum-time').textContent = totalTime;
  document.getElementById('sum-stars').textContent = totalStars;
}

  const suspect = prompt("Enter Suspect ID or Name:", "Unknown") || "Unknown";
  let totalFine = 0; let totalTime = 0; let totalStars = 0;
  let report = `**ARREST REPORT**\n**Suspect:** \`${suspect}\`\n\n**Charges:**\n`;
  selectedCharges.forEach(c => {
    totalFine += c.fine; totalTime += c.time; totalStars += c.stars;
    report += `> **${c.code}** - ${c.reason}\n`;
  });
  report += `\n**Total Fine:** \`$${totalFine.toLocaleString()}\`\n**Total Time:** \`${totalTime} Months\`\n**Wanted Level:** \`${totalStars > 5 ? 5 : totalStars} Stars\``;
  copyText(report);
}

function clearCart() {
  selectedCharges = [];
  document.querySelectorAll('.table tr.selected').forEach(el => el.classList.remove('selected'));
  updateSummaryPanel();
  showToast("Charges cleared.");
}

function renderPatrolGuide(tab) {
  const dataToRender = tab === 'penal' ? penalCodeStructure : trafficCodeStructure;
  let html = `
    <div class="summary-panel">
      <div class="summary-block" style="min-width:100px;">
        <span class="summary-label">Fines</span>
        <span class="summary-value money" id="sum-fines">$0</span>
      </div>
      <div class="summary-block" style="min-width:80px;">
        <span class="summary-label">Time</span>
        <span class="summary-value" style="color:var(--danger);" id="sum-time">0</span>
      </div>
      <div class="summary-block" style="min-width:80px;">
        <span class="summary-label">Stars</span>
        <span class="summary-value" style="color:var(--warning);" id="sum-stars">0</span>
      </div>
      <div class="summary-actions">
        <button class="btn" onclick="clearCart()">Clear</button>
        <button class="btn btn-primary" onclick="generateDiscordReport()">Copy Discord Report</button>
      </div>
    </div>
    <div class="toolbar-row">
      <div class="sub-tabs">
        <button class="sub-tab ${tab === 'penal' ? 'active' : ''}" onclick="go('patrol', 'penal')">Penal Code</button>
        <button class="sub-tab ${tab === 'traffic' ? 'active' : ''}" onclick="go('patrol', 'traffic')">Traffic Code</button>
      </div>
      <input type="text" placeholder="Search by code or description..." style="padding:8px 12px; border:1px solid var(--line); border-radius:6px; width:300px; outline:none;" onkeyup="document.querySelectorAll('.table tbody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(this.value.toLowerCase()) ? '' : 'none')">
    </div>`;

  dataToRender.forEach(group => {
    html += `<div class="article-group"><div class="article-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'"><span>${group.article}</span> <span>▼</span></div><div style="display:block;"><table class="table"><thead><tr><th width="40"></th><th>Code</th><th>Charges</th><th>Fine</th><th>Time</th><th>Stars</th></tr></thead><tbody>`;
    group.charges.forEach(r => {
      const isSelected = selectedCharges.some(c => c.code === r[0]);
      let tags = "";
      if (r[5] === "No Bail") tags += `<span class="tag tag-yellow">No Bail</span>`;
      if (r[5] === "Revoke Driver") tags += `<span class="tag tag-red">Rev. Driver</span>`;
      if (r[5] === "Revoke Gun") tags += `<span class="tag" style="background:#d1fae5; color:#059669; border:1px solid #10b981;">Rev. Gun</span>`;

      html += `<tr class="${isSelected ? 'selected' : ''}" onclick="toggleCharge('${r[0]}', '${r[1].replace(/'/g,"\\'")}', ${r[2]}, ${r[3]}, ${r[4]}, this)">
        <td><div class="cb-custom"></div></td><td style="font-weight:700;">${r[0]}</td><td>${r[1]} ${tags}</td>
        <td class="money">$${r[2].toLocaleString()}</td><td>${r[3] === 0 ? "-" : r[3]}</td><td class="stars">${r[4] === 0 ? "-" : '⭐'.repeat(r[4])}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });
  return html;
}

// --- LOGIC: ORGANIZATIONS ---
let currentOrg = 'FIB'; let currentBadge = 'XXX'; let currentOrgCategory = 'Duty & Identification';

function toggleOrgMenu(el) {
  document.getElementById('orgMenu').classList.toggle('open');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

function loadOrg(orgName, el) {
  currentOrg = orgName;
  document.querySelectorAll('.org-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  go('orgs');
}

function formatCommand(cmd) { return cmd.replace(/\{ORG\}/g, currentOrg).replace(/\{BADGE\}/g, currentBadge).replace(/\{TIME\}/g, getCurrentTime()); }

function renderOrgCommands() {
  let tabsHtml = '';
  Object.keys(orgCommands).forEach(cat => {
    tabsHtml += `<button class="sub-tab ${currentOrgCategory === cat ? 'active' : ''}" onclick="currentOrgCategory='${cat}'; go('orgs');">${cat}</button>`;
  });

  let html = `<div class="hero"><h1>${currentOrg} Operations</h1><p>Generate bodycam commands tailored for your department.</p></div>
    <div class="toolbar-row">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-weight:600; color:var(--text-muted); font-size:12px;">YOUR BADGE:</span>
        <input type="text" value="${currentBadge}" onkeyup="currentBadge=this.value; go('orgs');" style="padding:6px 12px; border:1px solid var(--line); border-radius:6px; width:100px; text-align:center; font-weight:700;">
      </div>
      <div class="sub-tabs">${tabsHtml}</div>
    </div>
    <div class="article-group"><table class="table"><thead><tr><th width="30%">Scenario</th><th>Command (Click to Copy)</th></tr></thead><tbody>`;

  const data = orgCommands[currentOrgCategory];
  Object.keys(data).forEach(scenario => {
    const cmds = data[scenario];
    cmds.forEach((cmd, index) => {
      html += `<tr class="copy-row" onclick="copyText('${formatCommand(cmd).replace(/'/g,"\\'")}')">`;
      if (index === 0) html += `<td rowspan="${cmds.length}" style="font-weight:600; background:#fafafa; border-right:1px solid var(--line); vertical-align:top;">${scenario}</td>`;
      html += `<td class="cmd-text">${formatCommand(cmd)}</td></tr>`;
    });
  });
  html += `</tbody></table></div>`;
  return html;
}

// --- LOGIC: OCR TICKETING TOOL ---
function renderTicketingTool() {
  return `<div class="hero"><h1>Vehicle Ticketing Tool</h1><p>Upload a screenshot for ALPR / OCR extraction.</p></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
      <div class="article-group" style="padding:24px;">
        <input type="file" id="fileInput" style="display:none;" accept="image/*">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:32px; margin-bottom:10px;">📸</div>
          <h3 style="margin:0 0 5px; color:var(--text-main);">Drop screenshot here</h3>
          <p style="margin:0; font-size:12px;">Drag & drop • Paste with Ctrl+V</p>
        </div>
      </div>
      <div class="article-group" style="padding:24px;" id="extracted-content">
        <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:var(--text-muted); text-align:center;">
          <span style="font-size:24px; margin-bottom:10px;">🚙</span> Upload image to see extracted details.
        </div>
      </div>
    </div>`;
}

function attachTicketingListeners() {
  const dropzone = document.getElementById('dropzone');
  if(!dropzone) return;
  
  async function handleImageUpload(file) {
    const panel = document.getElementById('extracted-content');
    if(!file.type.startsWith('image/')) return;
    panel.innerHTML = `<div style="text-align:center; padding-top:40px; color:var(--text-muted);">Analyzing image...<br><small>Please wait</small></div>`;
    try {
      const result = await Tesseract.recognize(file, 'eng');
      const plateMatch = result.data.text.match(/\b[A-Z0-9]{2,8}\b/);
      panel.innerHTML = `
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">License Plate</label><input type="text" id="t-plate" value="${plateMatch ? plateMatch[0] : ''}" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">Violation Code</label><input type="text" id="t-reason" placeholder="e.g. T.C. 6.2.A" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">Fine Amount</label><input type="text" id="t-fine" placeholder="e.g. 5000" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;" onclick="copyText('VEHICLE TICKET\\nPlate: '+document.getElementById('t-plate').value+'\\nCode: '+document.getElementById('t-reason').value+'\\nFine: $'+document.getElementById('t-fine').value)">Copy Ticket</button>
      `;
    } catch(e) { panel.innerHTML = `<div style="color:var(--danger); text-align:center; padding-top:40px;">OCR Failed.</div>`; }
  }

  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = "var(--primary)"; });
  dropzone.addEventListener('dragleave', () => dropzone.style.borderColor = "");
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.style.borderColor = ""; if(e.dataTransfer.files.length) handleImageUpload(e.dataTransfer.files[0]); });
  document.getElementById('fileInput').addEventListener('change', (e) => { if(e.target.files.length) handleImageUpload(e.target.files[0]); });
  document.addEventListener('paste', (e) => { if (document.getElementById('dropzone')) { const items = (e.clipboardData || e.originalEvent.clipboardData).items; for (let i in items) { if (items[i].kind === 'file') handleImageUpload(items[i].getAsFile()); } } });
}

// --- LOGIC: ARREST PROCEDURE ---
function renderArrestSteps() {
  let html = `<div class="hero"><h1>Arrest Procedure (10-15)</h1><p>Standard 15-step protocol. Click 'Copy Script' to quickly paste lines in game.</p></div><div style="max-width:900px;">`;
  procedureData.forEach(s => {
    html += `<div class="step">
      <h3>${s[0]} <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="copyText('${s[2].replace(/'/g,"\\'")}');">COPY SCRIPT</button></h3>
      <p>${s[1]}</p>
      ${s[2] ? `<div class="quote">💬 ${s[2]}</div>` : ''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

// --- ROUTER ---
function go(page, tab = 'penal') {
  const c = document.getElementById('content');
  const title = document.getElementById('topTitle');
  
  if (page === 'dashboard') {
    title.textContent = 'Dashboard'; 
    c.innerHTML = `<div class="hero"><h1>Welcome Officer.</h1><p>Unified utility console for Grand RP. Select a tool from the sidebar to begin processing.</p></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px;">
      <div class="card" style="cursor:pointer;" onclick="go('patrol')"><div class="card-body"><h3 style="margin:0 0 8px;">📖 Smart Calculator</h3><p style="margin:0;color:var(--text-muted);">Auto-calculate fines & stars.</p></div></div>
      <div class="card" style="cursor:pointer;" onclick="go('ticketing')"><div class="card-body"><h3 style="margin:0 0 8px;">🎫 Ticketing Tool</h3><p style="margin:0;color:var(--text-muted);">Extract plates via OCR.</p></div></div>
      <div class="card" style="cursor:pointer;" onclick="document.getElementById('orgMenu').classList.add('open'); loadOrg('FIB', document.querySelector('.org-item:nth-child(2)'));"><div class="card-body"><h3 style="margin:0 0 8px;">🛡️ Org Commands</h3><p style="margin:0;color:var(--text-muted);">Generate Bodycam RP lines.</p></div></div>
    </div>`;
  }
  else if (page === 'patrol') { title.textContent = 'Smart Calculator'; c.innerHTML = renderPatrolGuide(tab); setTimeout(updateSummaryPanel, 50); }
  else if (page === 'arrest') { title.textContent = 'Arrest Procedure'; c.innerHTML = renderArrestSteps(); }
  else if (page === 'ticketing') { title.textContent = 'Vehicle Ticketing Tool'; c.innerHTML = renderTicketingTool(); setTimeout(attachTicketingListeners, 100); }
  else if (page === 'orgs') { title.textContent = 'Organizations Console'; c.innerHTML = renderOrgCommands(); }
  
  window.scrollTo(0,0);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeNav = document.querySelector(`.nav-item[onclick*="'${page}'"]`);
  if (activeNav) activeNav.classList.add('active');
  
  if(window.innerWidth <= 900) { document.getElementById('sidebar').style.transform = 'translateX(-100%)'; }
}

// Init
go('dashboard');

// Mobile sidebar handling
document.getElementById('mobileMenu').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  sb.style.transform = sb.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
});
document.addEventListener('click', (e) => {
  const sb = document.getElementById('sidebar');
  if(window.innerWidth <= 900 && sb.style.transform === 'translateX(0px)' && !sb.contains(e.target) && e.target.id !== 'mobileMenu') {
    sb.style.transform = 'translateX(-100%)';
  }
});
</script>
