<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grand RP Police Wiki — rules, penal code, traffic code, arrest procedures and event guides.">
<title>Grand RP Police Wiki</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--text:#111827;--muted:#6b7280;
  --line:#e5e7eb;--accent:#2563eb;--accent2:#1d4ed8;--sidebar:#0f172a;
  --sidebarText:#cbd5e1;--sidebarMuted:#94a3b8;--danger:#dc2626;--success:#059669;
  --shadow:0 8px 30px rgba(15,23,42,.07);--radius:16px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:var(--sidebar);color:#fff;padding:20px 14px;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:7px 10px 22px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:grid;place-items:center;font-weight:800;box-shadow:0 8px 24px #0004}
.brand strong{font-size:15px}.brand small{display:block;color:var(--sidebarMuted);margin-top:2px;font-size:11px}
.nav-title{padding:14px 10px 7px;color:#64748b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.nav button{width:100%;border:0;background:transparent;color:var(--sidebarText);padding:10px 11px;border-radius:10px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer;margin:2px 0;font-size:13px}
.nav button:hover{background:#1e293b;color:#fff}.nav button.active{background:#2563eb;color:#fff;box-shadow:0 5px 16px #2563eb44}
.nav .ico{width:18px;text-align:center;opacity:.9}
.main{margin-left:270px;width:calc(100% - 270px)}
.topbar{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:10}
.search{flex:1;max-width:680px;position:relative}.search input{width:100%;padding:12px 44px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);outline:none}.search input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #3b82f622}
.search span{position:absolute;left:14px;top:11px;color:var(--muted)}.kbd{position:absolute;right:10px;top:8px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--muted);font-size:10px;background:#fff}
.top-actions{margin-left:auto;display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;cursor:pointer}
.content{max-width:1250px;margin:auto;padding:30px}
.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;border-radius:22px;padding:30px;box-shadow:var(--shadow);margin-bottom:24px}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#dbeafe;max-width:750px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h2,.card-head h3{margin:0;font-size:17px}.card-body{padding:20px}
.rule{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff;overflow:hidden}.rule summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:700;display:flex;gap:10px;align-items:flex-start}.rule summary::-webkit-details-marker{display:none}.rule summary:before{content:'›';color:var(--accent);font-size:19px;line-height:16px}.rule[open] summary:before{transform:rotate(90deg)}.rule .desc{padding:0 15px 15px 39px;color:#374151;line-height:1.65;font-size:13px}
.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:800;white-space:nowrap}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#f8fafc}.code{font-weight:800;color:#1d4ed8;white-space:nowrap}.money{font-weight:700;white-space:nowrap}.dash{color:#9ca3af}
.notice{padding:13px 15px;border-left:4px solid var(--accent);background:#eff6ff;border-radius:8px;color:#1e3a8a;font-size:12px;line-height:1.6;margin-bottom:15px}
.warn{border-left-color:#f59e0b;background:#fffbeb;color:#92400e}
.section-title{font-size:24px;margin:0 0 7px}.section-sub{color:var(--muted);margin:0 0 22px;font-size:13px}.article{margin-bottom:24px}.article h3{font-size:16px;margin:0 0 10px}
.traffic-group{margin-bottom:18px}.traffic-group h3{font-size:14px;margin:0 0 9px}
.procedure .step{position:relative;padding:17px 18px 17px 58px;border:1px solid var(--line);border-radius:13px;margin:10px 0;background:#fff}.stepno{position:absolute;left:17px;top:17px;width:27px;height:27px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:11px;font-weight:800}.step h3{margin:0 0 7px;font-size:14px}.step p,.step li{font-size:13px;line-height:1.65;color:#374151}.quote{border-left:3px solid #94a3b8;background:#f8fafc;padding:10px 12px;margin:10px 0;font-style:italic;font-size:12px;color:#334155;border-radius:0 8px 8px 0}
.map{width:100%;max-height:560px;object-fit:contain;background:#020617;border-radius:12px}.eventgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.eventcard{border:1px solid var(--line);border-radius:13px;padding:17px;background:#fff}.eventcard h3{margin:0 0 10px;font-size:15px}.eventcard li{font-size:12px;line-height:1.65;margin:5px 0;color:#374151}
.footer{color:#94a3b8;text-align:center;font-size:11px;padding:25px}
.empty{padding:45px;text-align:center;color:var(--muted)}.hidden{display:none!important}
.mobilebtn{display:none}
.modal{position:fixed;inset:0;background:#02061799;display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:50}.modal.show{display:flex}.modalbox{width:min(720px,92vw);background:#fff;border-radius:18px;box-shadow:0 30px 80px #0005;overflow:hidden}.modalbox input{width:100%;padding:18px;border:0;border-bottom:1px solid var(--line);outline:0}.results{max-height:55vh;overflow:auto}.result{padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#f8fafc}.result b{display:block;font-size:12px}.result span{font-size:11px;color:var(--muted)}
@media(max-width:1000px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobilebtn{display:block}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.content{padding:17px}.topbar{padding:0 14px}.hero{padding:22px}.hero h1{font-size:24px}.grid{grid-template-columns:1fr 1fr}.eventgrid{grid-template-columns:1fr}.kbd{display:none}}
</style>
</head>

<script>
const rules = {
general: {
title:"General Rules", sub:"Official server rules and regulations. Violating these rules will result in the listed penalties.",
groups:[
["Account Rules",[
["1.1","Created account is property of the creator, your account cannot be shared or traded.","PERMANENT BAN"],
["1.2","Player is fully responsible for his account. The administration of Grand Role Play does not carry the responsibility for your own account. When access to account is lost (e.g. being hacked), your account will face the same punishments.",""],
["1.3","Any fraud against players is prohibited. We do not compensate lost money.","PERMANENT BAN"],
["1.4","It is forbidden to have more than 1 additional account (Twinking).","Permanent ban to all accounts except main account. Main account will get ban up to 60 days"],
["1.5","It is forbidden to have more than 1 business, including additional accounts. 1 person – 1 business.","Ban 30 days each account"],
["1.6","The attempt to sell/buy game property for real money is prohibited.","PERMANENT BAN"],
["1.7","It is forbidden to transfer property as a gift (including neon shoes), whose total amount exceeds $5,000,000 (You are allowed to receive $5,000,000 and transfer $5,000,000 per day). It is allowed to withdraw/deposit money from/to family balance.","Ban 60 days"],
["1.8","It is prohibited to interact between your main account and twink. Any transfer of property or money will lead to permanent ban of both accounts.","PERMANENT BAN"],
["1.9","It is forbidden to evade our systems of selling/buying. If you are evading TAX (e.g. selling/buying/trading house/items/cars/clothes for 1k and then taking money).","Ban 60 days"]]],
["Nickname Creation",[["2.1","Names must be realistic, relate to names in the real world, and cannot be names of famous persons.","Jail 10 min and change nickname"]]],
["Rules of Communication",[
["3.1","Insulting of the person (OOC) is strictly prohibited.","Mute 180 minutes or ban up to 7 days"],
["3.2","Parents should not be mentioned in all chats, including voice.","Mute 180 minutes or ban up to 7 days"],
["3.3","All players must be able to communicate in English and IC chat must be English only. Other languages may be used in private only if everyone who can see has agreed to it.","Mute 120 min"]]],
["Hacking and Use of Software",[["4.1","Players must not have any kind of software that gives any advantage (disabling drug effects, hacks, bots etc.).","Ban 60 days"]]],
["Rules About Administration",[
["5.1","It is strictly prohibited to use report for questions that are not related to the game or problems on the server.","Mute 20-60 minutes"],
["5.2","All players must be adequate while communicating with the administration. In case of disagreement with the decision of the administration — leave the complaint for consideration to the chief administrator.",""],
["5.3","Insulting the administration is strictly prohibited. Complaint is the best way to achieve justice.","Ban 7 days"]]],
["Rules of Play",[
["6.1","Incorrect use of the /me /do /try /todo commands is prohibited. The player is obliged to play only the truth. Note: /try can only be used 2 times per situation.",""],
["6.2","It is forbidden to leave the RP situation by refusing to continue the RP situation, not accepting/refusing first aid, leaving the game, AFK or entering in an interior, etc.","WARN"],
["6.3","It is forbidden to empty the warehouse of the organisation for personal purposes.","Permanent ban"],
["6.4","It is forbidden to play the bad side of an employee of state structures (e.g. a bad cop, a politician) without having an RP biography.","WARN"],
["6.5","It is prohibited to do any criminal acts against EMS employees (kill, rob, etc.).","WARN"],
["6.6","Forbidden to heal and loot in the gunfight.","Jail 60 min"],
["6.7","If you got killed you cannot go back in a fight for 15 minutes.","WARN"],
["6.8","It is restricted to do any amoral actions in relation to an unconscious person (e.g. spitting, sexual animations, etc.).","BAN 3-7 days"],
["6.9","It is restricted to do any sexual actions in relation to any person. It is allowed to leave in case if you are a victim of sexual harassment (RP rape), etc.","BAN 3-7 days"],
["6.10","It is prohibited to move IC situations to OOC (e.g. insulting someone in Discord Chat relating to an IC situation). Any instances of this will be punished in Discord as well as In-Game Bans.","Ban 1-7 days"],
["6.11","It is forbidden to play on an additional account (TWINK) for the \"vice versa\" organization. If your main is STATE, twink can only be STATE — if main is GANG, twink can only be GANG.","WARN for both accounts"],
["6.12","Harassing EMS employee during duty or showing inappropriate behaviour in relation to EMS employees is restricted. Exception: EMS employee was disrespectful.","Ban up to 7 days"],
["6.13","It is restricted to kill person who is unconscious to help him to avoid RP situation (Mercy killing).","Demorgan 120 min or WARN"],
["6.14","It is allowed to rob from inventory ONLY Ammunition, Guns, any armor (Gang, FIB, LSPD etc.), balaclava and Drugs. MONEY can be robbed only using system functionality of gangs.","Ban 1-7 days"],
["6.15","When outside the GHETTO you must engage in RP before shooting someone. For example issue them demands and if they do not listen to your demands within 5 seconds you can shoot them.","WARN"],
["6.16","During robbery of person, armoured car, trucks (any kind of transport) must be at least 2 cars and 4 persons to stop them and rob. In case if they did not stop it is considered as \"Power Gaming\".","Jail 120 min or WARN"],
["6.18","It is forbidden to use helicopters to gain access to roofs that cannot be accessed by foot or ladder.","Jail 120 min"],
["6.19","F-words and N-words are restricted.","Ban 1-3 days"],
["6.20","Muting other players, which leads to avoiding RP shall not exempt from liability to punishment and falls under Fail RP.","Warn"],
["6.21","It is forbidden to abuse armored cars (impossible to shoot players inside).","Warn"],
["6.22","It is forbidden to sell/buy family businesses or withdraw/deposit money on/from fam balance without fam leaders approval, as well as taking from warehouse and family cars. Falls under rule of scam 1.3.",""],
["6.23","Any kind of bug abuse is forbidden.","BAN up to PERMANENT"],
["6.24","It is forbidden to rob/kidnap people who working on starting jobs such as busmen/taxi drivers/electricians, etc.",""],
["6.25","It is forbidden to rob/kidnap people on the territory of Fort Zancudo (National Guard).","WARN"],
["6.26","It is forbidden to abuse EMS clothes if you are not EMS employee.","WARN or BAN up to 7 days"],
["6.27","Placing contraband machines inside other objects or physically inaccessible areas is not allowed.","Ban 1-3 days"]]]
]},
state:{title:"State Rules",sub:"Official server rules and regulations. Violating these rules will result in the listed penalties.",groups:[
["General Rules for State",[
["1.1","All staff members are required to comply with established standards.",""],
["1.2","It is forbidden to transfer your members of organisation into another organisation. Exception: If both leaders of organisations agree for it.","Verbal warning to the leader"],
["1.3","It is forbidden to accept people with criminal record.",""],
["1.4","It is forbidden to drive an armor vehicle in the city without an escort. Note: armored cars like Kuruma, Insurgents, BTR.",""],
["1.5","Employees of LSPD have the right to search a car. If they find any illegal weapons or drugs they have the right to confiscate them. All of it should be recorded on video.",""],
["1.6","It is forbidden to search a car without Role play commands /try, /do, /me.",""],
["1.7","FIB could take a lead on the special operations if other organisations take part in it.",""],
["1.8","Laws are wrote by the government and every state organisation should follow them.",""],
["1.9","If there is an emergency state all state organisation must react including: EMS who have to send two emergency cars to the selected point.",""],
["1.10","All state organisation must not wear a mask on duty. Exceptions are special forces of FIB / LSPD / SAHP / USSS / NG — which are allowed to use on duty ONLY masks available in Warehouse of their organisation.",""],
["1.11","All state employees are forbidden to search cars or people without role play commands or if there is not a role play situation. Note: If there is a raid all state employees require a search warrant.",""],
["1.12","Players in state organisations could play their character as a \"bad cop\". Note: 5 bad cops are the limit per org. Player must write a biography approved by senior curator of state. Bad cops are allowed to ask for illegal items.",""],
["1.13","The title district of the gang is the place (skull on the map) where the gang is most active. State employees cannot come without an IC reason (e.g. Raid).",""],
["1.14","You have 25 minutes to put a person in jail starting from the moment of cuffing them. If a lawyer is present this time can be increased.","Demorgan 120 min"],
["1.15","Looting in a gun fight is forbidden for state employees.","Demorgan 120 min"],
["1.16","Running with a person while he is handcuffed is forbidden.","Demorgan 120 min"],
["1.17","It is prohibited to shoot from armoured cars (e.g. Kuruma).","Demorgan 120 min"],
["1.18","EMS employees must not assist unconscious people during an active gunfight. You must leave the area until it is deemed safe.","Demorgan 120 min"],
["1.19","It is forbidden to put barricades in front of the alarm panel. All markers must be easily reached by gangs.",""],
["1.20","Governor must conduct a meeting with all leaders of state orgs and put a screenshot of amendments made in the channel called \"legislation change\".","WARN (to leader)"],
["1.21","Leaders must review the legislation change within the limit of 48 hours.","Verbal warning"],
["1.22","If a leader agrees with legislation changes he has to write \"approved\" in the channel called \"legislation change\".",""],
["1.23","A leader cannot disagree to a legislation change without a valid reason.","Verbal Warning"],
["1.24","All amendments made should be approved by Senior Curator of State which the governor has to tag in the channel \"legislation change\".","WARN (to leader)"],
["1.25","Every state organisation must do ghetto patrols 3 times in a week (Minimum 8 people).",""]]],
["Government",[
["2.1","Employees have the right to use all available means of defense in case of danger to senior officials.",""],
["2.2","The government has the right to hold events for citizens of a large-scale nature once a day: a car fair, a trading platform, etc.",""],
["2.3","Events of a larger scale should always be co-ordinated with the curator of your faction.",""],
["2.4","The government has the right to establish regulations for civilians visiting the Capitol.",""],
["2.5","A lawyer has the right to ask for evidence against the accused and his ask cannot be denied.",""],
["2.6","The government has the right to establish regulations for public and private inspections. (No more than 7 checks per week, and no more than 2 checks of one faction per week.)",""],
["2.7","A government audit has the right to dismiss an employee of a public or private organisation if, after internal review, it has revealed any violations.",""],
["2.8","The government is obliged to negotiate all laws and bills with other heads of public and private organizations if the laws affect the work of these organizations.",""],
["2.9","The government has the right to create laws/bills, provided that they do not contradict the RP component or logic.",""],
["2.10","The government has no right to use the treasury for personal purposes.",""],
["2.11","The government has the power to issue various licenses. The price is regulated by the leader of the organization.",""],
["2.12","The government should have at least two lawyers on staff who will be qualified and will be able to represent someone's interests.",""],
["2.13","The state government is required to conduct small or medium events for state residents at least once every 3 days.",""]]],
["EMS",[
["3.1","Hospital staff are obliged to provide assistance to absolutely every player, without exception.",""],
["3.2","The chief doctor sets the internal regulations of the hospital, with approval with the government and the curator.",""],
["3.3","The chief doctor has the right to check state organizations for any diseases no more than twice in a week per organization.",""]]],
["National Guard",[
["4.1","All national guard employees cannot leave Fort Zancudo during their duty. Exception: If leader allows it.",""],
["4.2","National guard must follow all state laws.",""],
["4.3","National guard can arrest a person and deliver to any state organisation except for EMS.",""],
["4.4","National guard employees can use weapons in emergency situations.",""],
["4.5","National guard special division can patrol the state for the presence of crime activity.",""]]],
["LSPD / SAHP / FIB",[
["5.1","All those state organisations can arrest a person if they suspected him of a criminal activity.",""],
["5.2","LSPD/SAHP/FIB cannot stop a person, search him or ask for passport without an IC reason.",""],
["5.3","LSPD/SAHP/FIB could use weapons if a role-play situation requires it.",""],
["5.4","LSPD/SAHP/FIB cannot arrest a person while gunfight is not finished.","Verbal Warning"],
["5.5","LSPD/SAHP/FIB could patrol ghetto if there are more than two special officers.","Verbal Warning"],
["5.6","LSPD/SAHP/FIB require to have a bodycam for each arrest.","Verbal warning (no evidence)"],
["5.7","If LSPD/FIB/SAHP employee is attacked, he can request all the forces for supporting him (Code 0).",""],
["5.8","It is forbidden to remove masks from critically wounded criminals.","Demorgan 300 min"],
["5.9","It is allowed to unmask only for identification and further detention, as well as for entering a person into the state database.",""],
["5.10","LSPD/FIB/SAHP employees are obliged to use only official transport for calls. Exception: Undercover officers may go out discreetly for investigation.","Verbal warning"],
["5.11","LSPD/FIB/SAHP/NG/GOV/EMS employees cannot use official vehicles for personal use.","Verbal warning"],
["5.12","LSPD/FIB/SAHP employees cannot stop EMS employees in case of their movement on calls. Exception: special operation.","Demorgan 120 min"]]],
["Raid Rules",[
["6.1","It is forbidden to do raid without a serious IC reason (e.g. Case file).",""],
["6.2","It is forbidden to leave a game while there is a raid.",""],
["6.3","Raids are carried out on the territory of a criminal organization or group.",""],
["6.4","During the raid state employees can search any person on the territory of the raid.",""],
["6.5","There has to be a minimum of 20 state employees who take part in the raid.",""],
["6.6","Each state organisation can do a raid no more than once in 48 hours.",""],
["6.7","Prime time for raids: 19:00 to 00:00.",""],
["6.8","Raid warrant is issued by the Attorney General's Office: Attorney General and/or his deputy/governor. In the absence of an active government, the raid warrant is issued by the head of the FIB department.",""],
["6.9","It is allowed to search vehicles located on the territory of the criminal faction.",""],
["6.10","PDA is counting as OOC information. If you found a wanted criminal and want to arrest him, you have to ask him to show his passport for identification. If he refuses, state employees have all rights to arrest him for identification.",""]]],
["Lifeinvader",[["7.1","Talent show must be once in two weeks.",""]]]
]},
green:{title:"Green Zone Rules",sub:"A Green Zone is a place where all criminal activities are forbidden.",groups:[
["General Rules for Green Zone",[
["1.1","Green Zone killings are prohibited.","Warn"],
["1.2","It is forbidden to buy weapons, drugs. Also to kidnap, rob people and put bags on player's head.","Warn"],
["1.3","It is forbidden to leave RP situation by joining in a green zone.","Warn"]]],
["List of All Green Zones",[
["2.1","Government agencies: Central Hospital, Government, FIB, LSPD, SAHP.",""],
["2.2","Initial and public works: Truckers, Electricians, Sawmill, Farm 1-2, Bus workers, Taxi companies, Oil rig.",""],
["2.3","Enterprises: Car dealerships, Motorcycle dealerships, Boat sales, Air transport sales, Service stations, Shops 24/7, Clothing stores, Jewelry store, Parking spaces, Burger shop, Gas station, Construction site, Bar, Black market.",""],
["2.4","Other: Lifeinvader, LS Airport, Licensing Center, Trade Market, Stadium, Casino, Prison, Post Office, Auto Fair, Real Estate Agency, Recruiting Office, Weapon Assembly, Beach Gym, Resource Exchange Points, Purchasing Rooms, Bank, ATM, Fishing Pier, Residential complex, Auto theft, Bunker.",""]]]
]},
ghetto:{title:"Ghetto Rules",sub:"Official server rules and regulations. Violating these rules will result in the listed penalties.",groups:[
["General Ghetto Rules",[

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function rulesPage(key){
 const d=rules[key]; let out=`<h1 class="section-title">${esc(d.title)}</h1><p class="section-sub">${esc(d.sub)}</p>`;
 d.groups.forEach(g=>{out+=`<div class="card"><div class="card-head"><h2>${esc(g[0])}</h2><span class="badge">${g[1].length} rules</span></div><div class="card-body">`;
 g[1].forEach(x=>out+=`<details class="rule"><summary><span>${esc(x[0])}</span><span style="font-weight:500;flex:1">${esc(x[1])}</span>${x[2]?`<span class="badge">${esc(x[2])}</span>`:""}</summary>${x[2]?`<div class="desc"><b>Penalty:</b> ${esc(x[2])}</div>`:""}</details>`);
 out+=`</div></div>`}); return out;
}
function table(rows,cols){
 return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?'code':i===2?'money':''}">${esc(v||'-')}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function dashboard(){
 return `<div class="hero"><h1>Grand RP Police Wiki</h1><p>Quick-access handbook for state rules, penal code, traffic code, traffic stops, arrests, events and roleplay terminology. Built from the materials supplied for this wiki.</p></div>
 <div class="grid"><div class="stat"><b>${penal.length}</b><span>Penal Code entries</span></div><div class="stat"><b>${traffic.length}</b><span>Traffic Code entries</span></div><div class="stat"><b>15</b><span>Arrest steps</span></div><div class="stat"><b>${Object.keys(events).length}</b><span>Event guides</span></div></div>
 <div class="card"><div class="card-head"><h2>Quick Access</h2></div><div class="card-body"><div class="eventgrid">
 ${[['Penal Code','Complete PC table by article','penal'],['Traffic Code','Traffic + parking violations','traffic'],['10-15 Arrest','Step-by-step DOC process','arrest'],['10-51 Traffic Stop','Radar to contact phase','traffic-stop'],['State Rules','State organization rules','state'],['Ghetto Rules','Ghetto and capture rules','ghetto']].map(x=>`<div class="eventcard" style="cursor:pointer" onclick="go('${x[2]}')"><h3>${x[0]}</h3><p style="font-size:12px;color:var(--muted);margin:0">${x[1]}</p></div>`).join("")}
 </div></div></div>
 <div class="notice"><b>Source note:</b> Penal and Traffic Code entries below follow the supplied Patrolman's Guide PDF. The PDF's own article headings, codes, fines, times and stars are preserved as provided.</div>`;
}
function penalPage(){
 let articles={};
 penal.forEach(r=>{let a=r[0].split('.')[0]; if(!articles[a])articles[a]=[];articles[a].push(r)});
 const names={2:'Crimes Against Society',3:'Crimes Against the State',4:'Malfeasance',5:'Traffic Statute Crimes',6:'Judicial Crimes',8:'Commercial and Taxation Crimes',9:'Correctional Crimes'};
 let out=`<h1 class="section-title">Penal Code</h1><p class="section-sub">Patrolman's Guide — fines, sentence time and stars. Entries are grouped by article, rather than flattened into one list.</p>
 <div class="notice"><b>Legend from source:</b> Yellow = No Bailout • Blue = Sentence Varies on Officer’s Judgement • Red = Driver's License Revocation (High Command/DOJ approval) • Green = Gun License Revocation • Pink = All License Revocation • Black = Blacklist • Gray = Dismissal from Organization.</div>`;
 Object.keys(articles).forEach(a=>{out+=`<div class="card"><div class="card-head"><h2>ARTICLE ${a}: ${names[a]||''}</h2><span class="badge">${articles[a].length} entries</span></div><div class="card-body">${table(articles[a].map(r=>[`P.C. ${r[0]}`,r[1],r[2],r[3]||'-',r[4]||'-']),['Code','Crime','Fine','Time','Stars'])}</div></div>`});
 out+=`<div class="card"><div class="card-head"><h2>Article 10 — Violations of Public Order</h2></div><div class="card-body"><div class="notice">A misdemeanour does not ordinarily carry imprisonment unless multiple misdemeanours are committed. The supplied guide states that a suspect identified and fined for a misdemeanour is to be released immediately and may not be searched when only a misdemeanour has been committed. A combination exceeding 5 points may be considered for up to 30 months plus a maximum $25,000 fine.</div>${table(misdemeanors.map(r=>[`P.C. ${r[0]}`,r[1],r[2]]),['Code','Crime','Points'])}</div></div>`;
 return out;
}
function trafficPage(){
 return `<h1 class="section-title">Traffic Code</h1><p class="section-sub">Traffic statutes and parking violations from the supplied Patrolman's Guide.</p>
 <div class="card"><div class="card-head"><h2>Traffic Statute Crimes</h2></div><div class="card-body">${table(traffic.map(r=>[`T.C. ${r[0]}`,r[1],r[2],r[3],r[4]]),['Code','Description','Fine','Time','Stars'])}</div></div>
 <div class="card"><div class="card-head"><h2>Parking Violations</h2></div><div class="card-body"><p style="font-size:12px;color:var(--muted)">Parking along roadways: park in the direction of traffic with wheels parallel and next to the curb/side of road, or two right wheels on the curb.</p>${table(parking.map(r=>[`T.C. ${r[0]}`,r[1],r[2]]),['Code','Description','Fine'])}</div></div>
 <div class="card"><div class="card-head"><h2>Special / Location Parking</h2></div><div class="card-body">${table(specialParking.map(r=>[`T.C. ${r[0]}`,r[1],r[2]]),['Code','Description','Fine'])}</div></div>
 <div class="card"><div class="card-head"><h2>Habitual Traffic Offender</h2></div><div class="card-body"><div class="notice">The supplied guide defines a habitual traffic offender as a person who regularly and consistently violates traffic statutes by speeding or parking violations: three of the same type within seven days, three moving violations of the same type within seven days, or seven of any violation within seven days. Driver's License revocation must be approved by high command of the law enforcement officer or a DOJ judge.</div><div class="notice"><b>Aircraft Inspection:</b> Pilot licence checks, drug interdiction and safety inspections of aircraft coming into Sandy Shores Municipal Airfield. Operations are to be conducted by certified officers and may include joint operations as requested by SAHP leadership.</div></div></div>`;
}
function procedurePage(){
 let out=`<h1 class="section-title">10-15 Arrest Procedure</h1><p class="section-sub">The supplied Full Arrest Process PDF, presented as a clean step-by-step guide. No copy buttons are added to this procedure.</p>
 <div class="notice warn"><b>Important:</b> The source arrest-process PDF is reproduced as supplied. This page does not add or invent additional commands or penalties.</div><div class="card procedure"><div class="card-body">`;
 procedure.forEach((s,i)=>{out+=`<div class="step"><div class="stepno">${i+1}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>${s[2]?`<div class="quote">${esc(s[2])}</div>`:""}</div>`});
 out+=`</div></div>`; return out;
}
function trafficStopPage(){
 let out=`<h1 class="section-title">10-51 Traffic Stop Procedure</h1><p class="section-sub">Standard operating procedure for conducting traffic stops and issuing citations.</p><div class="card procedure"><div class="card-body">`;
 trafficStop.forEach(s=>{out+=`<div class="step"><div class="stepno">${s[0]}</div><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p>${s[3]?`<div class="quote">${esc(s[3])}</div>`:""}</div>`});
 out+=`</div></div>`; return out;
}
function eventsPage(){
 return `<h1 class="section-title">Event Rules</h1><p class="section-sub">Guidelines and protocols for major server events.</p><div class="eventgrid">${Object.entries(events).map(([k,v])=>`<div class="eventcard"><h3>${esc(k)}</h3><ol>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`).join("")}</div>`;
}
function mapPage(){
 return `<h1 class="section-title">Territory Map</h1><p class="section-sub">Territory image supplied with the wiki materials.</p><div class="card"><div class="card-body"><img class="map" src="assets/territory-map.png" alt="Territory map"></div></div>`;
}
function termsPage(){
 return `<h1 class="section-title">Roleplay Terms</h1><p class="section-sub">Common RP terminology from the supplied rules.</p><div class="card"><div class="card-body">${terms.map(t=>`<details class="rule" open><summary><span class="code">${esc(t[0])}</span><span style="font-weight:500;flex:1">${esc(t[1])}</span></summary></details>`).join("")}</div></div>`;
}
function render(page){
 const c=document.getElementById('content');
 let h=page==='dashboard'?dashboard():page==='penal'?penalPage():page==='traffic'?trafficPage():page==='arrest'?procedurePage():page==='traffic-stop'?trafficStopPage():page==='events'?eventsPage():page==='map'?mapPage():page==='terms'?termsPage():rulesPage(page);
 c.innerHTML=h; window.scrollTo({top:0,behavior:'smooth'});
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 document.getElementById('sidebar').classList.remove('open');
}
function go(page){render(page)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('themeBtn').addEventListener('click',()=>{
 const dark=document.documentElement.dataset.dark==='1';
 document.documentElement.dataset.dark=dark?'0':'1';
 if(!dark){document.documentElement.style.setProperty('--bg','#020617');document.documentElement.style.setProperty('--panel','#0f172a');document.documentElement.style.setProperty('--panel2','#111827');document.documentElement.style.setProperty('--text','#f8fafc');document.documentElement.style.setProperty('--muted','#94a3b8');document.documentElement.style.setProperty('--line','#1e293b');document.documentElement.style.setProperty('--sidebar','#020617');}
 else location.reload();
});
const modal=document.getElementById('modal'), modalSearch=document.getElementById('modalSearch'), results=document.getElementById('results');
const searchIndex=[];
Object.entries(rules).forEach(([k,v])=>v.groups.forEach(g=>g[1].forEach(x=>searchIndex.push({page:k,title:`${v.title} — ${g[0]} — ${x[0]}`,text:x[1]}))));
penal.forEach(x=>searchIndex.push({page:'penal',title:`P.C. ${x[0]} — ${x[1]}`,text:`${x[2]} ${x[3]} ${x[4]}`}));
traffic.forEach(x=>searchIndex.push({page:'traffic',title:`T.C. ${x[0]} — ${x[1]}`,text:`${x[2]} ${x[3]} ${x[4]}`}));
events && Object.keys(events).forEach(k=>searchIndex.push({page:'events',title:k,text:events[k].join(' ')}));
procedure.forEach((x,i)=>searchIndex.push({page:'arrest',title:`10-15 Step ${i+1} — ${x[0]}`,text:x[1]+' '+x[2]}));
function doSearch(q){
 q=q.trim().toLowerCase();
 if(!q){results.innerHTML='<div class="empty">Type to search the wiki.</div>';return}
 const hits=searchIndex.filter(x=>(x.title+' '+x.text).toLowerCase().includes(q)).slice(0,60);
 results.innerHTML=hits.length?hits.map(x=>`<div class="result" data-page="${x.page}"><b>${esc(x.title)}</b><span>${esc(x.text.slice(0,150))}${x.text.length>150?'…':''}</span></div>`).join(""):'<div class="empty">No results found.</div>';
 results.querySelectorAll('.result').forEach(el=>el.onclick=()=>{modal.classList.remove('show');go(el.dataset.page)});
}
document.getElementById('searchInput').addEventListener('focus',()=>{modal.classList.add('show');modalSearch.focus();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal.classList.add('show');modalSearch.focus()}if(e.key==='Escape')modal.classList.remove('show')});
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
modalSearch.addEventListener('input',e=>doSearch(e.target.value));
document.getElementById('searchInput').addEventListener('input',e=>{if(e.target.value){modal.classList.add('show');modalSearch.value=e.target.value;doSearch(e.target.value)}});
render('dashboard');
</script>
</body>
</html>
