<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #09090b; --panel: #18181b; --panel2: #27272a; --text: #f4f4f5; --muted: #a1a1aa;
  --line: #27272a; --sidebar: #09090b; --hover-bg: #27272a;
  --accent: #3b82f6; --accent-hover: #2563eb;
  --danger: #ef4444; --warning: #eab308;
  --radius: 12px; --shadow: 0 4px 20px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 80px; }
button, input { font: inherit; }

.app { display: flex; min-height: 100vh; }

.sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; background: var(--sidebar); border-right: 1px solid var(--line); padding: 24px 16px; overflow-y: auto; z-index: 20; transition: transform 0.3s; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 30px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: grid; place-items: center; font-weight: 800; color: #fff; }
.brand strong { font-size: 16px; letter-spacing: -0.02em; }
.brand small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }

.nav-title { padding: 16px 12px 8px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.nav button { width: 100%; border: 0; background: transparent; color: var(--muted); padding: 10px 12px; border-radius: 8px; text-align: left; display: flex; gap: 12px; align-items: center; cursor: pointer; margin: 2px 0; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.nav button:hover { background: var(--hover-bg); color: var(--text); }
.nav button.active { background: rgba(59,130,246,0.1); color: var(--accent); font-weight: 600; }
.nav .ico { width: 20px; text-align: center; font-size: 16px; }

.main { margin-left: 280px; width: calc(100% - 280px); display: flex; flex-direction: column; min-height: 100vh; }
.topbar { height: 70px; background: rgba(9,9,11,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 10; }

.search { position: relative; width: 300px; }
.search input { width: 100%; padding: 10px 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); outline: none; font-size: 14px; }
.search input:focus { border-color: var(--accent); }
.search span.icon { position: absolute; left: 14px; top: 10px; color: var(--muted); }

.clocks { display: flex; gap: 16px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; }
.clock-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
.clock-time { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

.content { max-width: 1200px; margin: 0 auto; padding: 40px 32px; width: 100%; flex: 1; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.hero { margin-bottom: 30px; }
.hero h1 { font-size: 28px; margin: 0 0 6px; }
.hero p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-body { padding: 24px; }

.tablewrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; text-align: left; }
.table th { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.table td { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text); vertical-align: middle; cursor: pointer; }
.table tr { transition: background 0.15s; }
.table tr:hover { background: var(--hover-bg); }
.table tr.selected { background: rgba(59,130,246,0.15); border-left: 3px solid var(--accent); }

.copy-btn { padding: 6px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; text-transform: uppercase; }
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Ticketing Tool Specific */
.ticketing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted); transition: all 0.2s; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; cursor: pointer; }
.dropzone.dragover { border-color: var(--accent); background: rgba(59,130,246,0.05); }
.btn-outline { padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%; }
.btn-outline:hover { background: var(--hover-bg); }
.extracted-panel { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 20px; min-height: 300px; display: flex; flex-direction: column; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; width: 100%; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.form-group input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); outline: none; }

/* Sticky Calculator Bar */
.calc-bar { position: fixed; bottom: 0; left: 280px; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); z-index: 50; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.calc-bar.active { transform: translateY(0); }
.calc-stats { display: flex; gap: 24px; }
.calc-stat { display: flex; flex-direction: column; }
.calc-stat span:first-child { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.calc-stat span:last-child { font-size: 18px; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.calc-stat.danger span:last-child { color: var(--danger); }
.calc-stat.warning span:last-child { color: var(--warning); }

.step { border-left: 2px solid var(--accent); padding-left: 20px; margin-bottom: 24px; position: relative; }
.step::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--panel); }
.step h3 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.step p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.quote { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 13px; font-family: monospace; color: var(--accent); }

.toast { position: fixed; bottom: 90px; right: 24px; background: #fff; color: #000; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
.toast.show { transform: translateY(0); opacity: 1; }
.mobilebtn { display: none; background: transparent; border: 1px solid var(--line); color: var(--text); width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; }

@media(max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
  .main { margin-left: 0; width: 100%; }

  .calc-bar { left: 0; flex-direction: column; gap: 16px; padding: 16px; }
  .calc-stats { width: 100%; justify-content: space-between; }
  .ticketing-grid { grid-template-columns: 1fr; }

// --- SMART CALCULATOR LOGIC ---
let selectedCharges = [];
let totalFine = 0;
let totalTime = 0;
let totalStars = 0;

function toggleCharge(code, reason, fine, time, stars, trElement) {
  const index = selectedCharges.findIndex(c => c.code === code && c.reason === reason);
  if(index > -1) {
    selectedCharges.splice(index, 1);
    totalFine -= fine; totalTime -= time; totalStars -= stars;
    trElement.classList.remove('selected');
  } else {
    selectedCharges.push({code, reason, fine, time, stars});
    totalFine += fine; totalTime += time; totalStars += stars;
    trElement.classList.add('selected');
  }
  updateCalcBar();
}

function updateCalcBar() {
  const bar = document.getElementById('calcBar');
  if(selectedCharges.length > 0) {
    bar.classList.add('active');
    document.getElementById('calc-fine').textContent = "$" + totalFine.toLocaleString();
    document.getElementById('calc-time').textContent = totalTime + " Months";
    document.getElementById('calc-stars').textContent = totalStars > 5 ? 5 : totalStars;
  } else {
    bar.classList.remove('active');
  }
}

function clearCalculator() {
  selectedCharges = []; totalFine = 0; totalTime = 0; totalStars = 0;
  document.querySelectorAll('.table tr.selected').forEach(el => el.classList.remove('selected'));
  document.getElementById('suspectName').value = "";
  updateCalcBar();
}

window.generateArrestReport = function() {
  const suspect = document.getElementById('suspectName').value || "Unknown";
  let report = `ARREST REPORT / PDA RECORD\nSuspect: ${suspect}\n\nCHARGES:\n`;
  selectedCharges.forEach(c => {
    report += `- ${c.code}: ${c.reason} ($${c.fine.toLocaleString()} | ${c.time}m | ${c.stars}*)\n`;
  });
  report += `\nTOTAL FINE: $${totalFine.toLocaleString()}\nTOTAL TIME: ${totalTime} Months\nWANTED LEVEL: ${totalStars > 5 ? 5 : totalStars} Stars`;
  
  navigator.clipboard.writeText(report).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

// --- RENDERING ---
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

  return `<div class="hero">

    <p>Unified wiki database and operational utility console for Grand RP.<br>Extracted directly from the official <strong>Full Arrest Process</strong> and <strong>Patrolman's Guide</strong>.</p>
  </div>
  <div class="card"><div class="card-head"><h2>Quick Action Tools</h2></div><div class="card-body" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px;">
    <div style="padding:20px; border:1px solid var(--line); border-radius:8px; cursor:pointer;" onclick="go('arrest')">
      <h3 style="margin:0 0 8px; color:var(--accent);">Arrest Procedure (10-15)</h3><p style="margin:0; font-size:13px; color:var(--muted);">Full 15-step procedure with scripts.</p>
    </div>
    <div style="padding:20px; border:1px solid var(--line); border-radius:8px; cursor:pointer;" onclick="go('penal')">

      <h3 style="margin:0 0 8px; color:var(--accent);">Vehicle Ticketing Tool</h3><p style="margin:0; font-size:13px; color:var(--muted);">Upload images for instant plate OCR.</p>

function renderCalcTable(title, sub, data) {
  let html = `<div class="hero"><h1>${title}</h1><p>${sub}</p></div>
  <div class="card"><div class="card-body tablewrap"><table class="table"><thead><tr>
  <th>Code</th><th>Description</th><th>Fine</th><th>Time</th><th>Stars</th></tr></thead><tbody>`;
  
  data.forEach(r => {
    const isSelected = selectedCharges.some(c => c.code === r[0] && c.reason === r[1]);
    html += `<tr class="${isSelected ? 'selected' : ''}" onclick="toggleCharge('${esc(r[0])}', '${esc(r[1])}', ${r[2]}, ${r[3]}, ${r[4]}, this)">
      <td style="color:var(--accent); font-weight:700;">${esc(r[0])}</td>
      <td>${esc(r[1])}</td>
      <td style="color:#22c55e; font-weight:600;">$${r[2].toLocaleString()}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderSteps(title, sub, data) {
  let html = `<div class="hero"><h1>${title}</h1><p>${sub}</p></div><div class="card"><div class="card-body">`;
  data.forEach(s => {
    html += `<div class="step">
      <h3>${s[0]} <button class="copy-btn" onclick="copyToClipboard('${esc(s[2])}')">COPY SCRIPT</button></h3>
      <p>${s[1]}</p>
      ${s[2] ? `<div class="quote">💬 ${s[2]}</div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

  <div class="ticketing-grid">
    <div class="card" style="margin:0;">
      <div class="card-body">
        <input type="file" id="fileInput" style="display:none;" accept="image/*">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:32px; margin-bottom:10px;">📸</div>
          <h3 style="margin:0 0 5px; color:var(--text);">Drop screenshot here, or click to upload</h3>
          <p style="margin:0; font-size:12px;">PNG, JPG, WEBP • Drag & drop • Paste with Ctrl+V</p>
          <div style="display:flex; gap:10px; margin-top:20px;" onclick="event.stopPropagation()">
            <button class="btn-outline" onclick="document.getElementById('fileInput').click()">📤 Browse</button>
            <button class="btn-outline">📋 Paste</button>
          </div>
        </div>
      </div>
    </div>

      <div class="card-body" style="padding-top:10px;">

            <span style="font-size:24px; margin-bottom:10px;">🚙</span>
            Results will appear here after you upload a screenshot.

function attachTicketingListeners() {
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if(!dropzone) return;

  async function handleImageUpload(file) {
    const panel = document.getElementById('extracted-content');
    if(!file.type.startsWith('image/')) return;
    panel.innerHTML = `<div style="text-align:center; padding-top:40px; color:var(--muted);">Analyzing image using OCR...<br><small>Please wait</small></div>`;
    try {
      const result = await Tesseract.recognize(file, 'eng');
      const text = result.data.text;
      const plateMatch = text.match(/\b[A-Z0-9]{2,8}\b/);
      const possiblePlate = plateMatch ? plateMatch[0] : '';
      panel.innerHTML = `
        <div class="form-group"><label>License Plate</label><input type="text" id="t-plate" value="${possiblePlate}"></div>
        <div class="form-group"><label>Violation Code</label><input type="text" id="t-reason" placeholder="e.g. T.C. 6.2.A"></div>
        <div class="form-group"><label>Fine Amount ($)</label><input type="text" id="t-fine" placeholder="e.g. 5000"></div>
        <button class="btn-outline" style="background:var(--accent); color:#fff; border:none; margin-top:10px;" onclick="copyTicketData()">Copy Ticket Report</button>
      `;
    } catch (e) { panel.innerHTML = `<div style="color:var(--danger); text-align:center; padding-top:40px;">Error scanning image.</div>`; }
  }

  window.copyTicketData = function() {
    const report = `VEHICLE TICKET\nPlate: ${document.getElementById('t-plate').value}\nCode: ${document.getElementById('t-reason').value}\nFine: $${document.getElementById('t-fine').value}`;
    copyToClipboard(report);
  }

  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if(e.dataTransfer.files.length) handleImageUpload(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => { if(e.target.files.length) handleImageUpload(e.target.files[0]); });
  document.addEventListener('paste', (e) => { if (document.getElementById('dropzone')) { const items = (e.clipboardData || e.originalEvent.clipboardData).items; for (let index in items) { if (items[index].kind === 'file') handleImageUpload(items[index].getAsFile()); } } });
}

function go(page) {
  const c = document.getElementById('content');
  const calcBar = document.getElementById('calcBar');
  
  if(page === 'penal' || page === 'traffic') calcBar.style.display = 'flex';
  else calcBar.style.display = 'none';

  if(page === 'dashboard') c.innerHTML = renderDashboard();
  else if(page === 'arrest') c.innerHTML = renderSteps("10-15 Arrest Procedure", "Complete 15-step procedure extracted from the Full Arrest Process protocol.", procedureData);
  else if(page === 'penal') c.innerHTML = renderCalcTable("Penal Code Calculator", "Click rows to build an arrest report automatically.", penalData);
  else if(page === 'traffic') c.innerHTML = renderCalcTable("Traffic Code Calculator", "Click rows to build a traffic citation report.", trafficData);
  else if(page === 'ticketing') { c.innerHTML = renderTicketingTool(); setTimeout(attachTicketingListeners, 100); }
  
  window.scrollTo(0,0);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('sidebar').classList.remove('open');
}

document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click', () => document.getElementById('sidebar').classList.add('open'));
go('dashboard');
</script>
