@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  /* Ultra-Modern Light Theme based on image_e04669.jpg */
  --bg: #f8fafc; 
  --panel: #ffffff; 
  --line: #e2e8f0; 
  --sidebar: #ffffff;
  --sidebar-hover: #f1f5f9;
  --text-main: #0f172a; 
  --text-muted: #64748b; 
  --accent: #0f172a; 
  --primary: #3b82f6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-main); font-size: 14px; overflow-x: hidden; }
button, input { font: inherit; outline: none; }

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
.brand { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid var(--line); }
.logo { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #1e293b, #0f172a); color: white; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.brand-text { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.nav-section { padding: 16px 12px; overflow-y: auto; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; color: var(--text-muted); text-decoration: none; cursor: pointer; transition: 0.2s; font-weight: 500; font-size: 13px; margin-bottom: 2px; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text-main); }
.nav-item.active { background: #f1f5f9; color: var(--text-main); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

/* Main Header */
.main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { height: 60px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 40; }
.breadcrumb { font-weight: 600; font-size: 16px; color: var(--text-main); }
.global-search { display: flex; align-items: center; background: #f1f5f9; border-radius: 6px; padding: 6px 12px; width: 300px; border: 1px solid transparent; transition: 0.2s; }
.global-search:focus-within { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.global-search input { border: none; background: transparent; width: 100%; padding: 4px; font-size: 13px; }
.topbar-actions { display: flex; align-items: center; gap: 16px; }
.btn-top { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border: none; background: transparent; padding: 6px 10px; border-radius: 6px; transition: 0.2s; }
.btn-top:hover { background: var(--sidebar-hover); color: var(--text-main); }

/* Content Area */
.content { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Module Tabs (e.g. Penal & Traffic, Radio Codes) */
.module-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
.module-tab { padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; color: var(--text-muted); background: transparent; transition: 0.2s; }
.module-tab:hover { background: #f1f5f9; color: var(--text-main); }
.module-tab.active { background: var(--accent); color: white; }

/* Sub Tabs & Search Row */
.toolbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
.sub-tabs { display: flex; background: #f1f5f9; padding: 4px; border-radius: 8px; }
.sub-tab { padding: 6px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; color: var(--text-muted); transition: 0.2s; border: none; background: transparent; }
.sub-tab.active { background: var(--panel); color: var(--text-main); box-shadow: var(--shadow-sm); }
.table-search { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; width: 350px; }
.table-search input { border: none; width: 100%; font-size: 13px; outline: none; }

/* Smart Cart / Summary Panel */
.summary-panel { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm); position: sticky; top: 76px; z-index: 30; gap: 32px; }
.summary-block { display: flex; flex-direction: column; gap: 4px; }
.summary-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.summary-value { font-size: 18px; font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }
.summary-actions { margin-left: auto; display: flex; gap: 12px; }
.btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text-main); transition: 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:hover { background: #f8fafc; }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: #2563eb; }
.charge-list-preview { font-size: 12px; color: var(--text-muted); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

/* Data Tables */
.article-group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
.article-header { padding: 16px 20px; background: #f8fafc; font-weight: 700; font-size: 13px; color: var(--text-main); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.table { width: 100%; border-collapse: collapse; text-align: left; }
.table th { padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; background: var(--panel); }
.table td { padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-main); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr { transition: background 0.15s; }
.table tr:hover { background: #f8fafc; }
.table tr.selected { background: rgba(59,130,246,0.05); }

/* Checkbox */
.cb-wrapper { display: flex; align-items: center; justify-content: center; }
.cb-custom { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 4px; cursor: pointer; display: grid; place-items: center; transition: 0.2s; background: var(--panel); }
.table tr.selected .cb-custom { background: var(--primary); border-color: var(--primary); }
.cb-custom::after { content: '✓'; color: white; font-size: 12px; font-weight: 800; display: none; }
.table tr.selected .cb-custom::after { display: block; }

/* Formatting */
.code-badge { font-weight: 700; color: var(--text-main); }
.money { color: var(--success); font-weight: 600; font-variant-numeric: tabular-nums; }
.stars { color: var(--warning); letter-spacing: 2px; font-size: 12px; }
.tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 8px; vertical-align: middle; display: inline-block; }
.tag-red { background: #fee2e2; color: #dc2626; border: 1px solid #f87171; }
.tag-yellow { background: #fef3c7; color: #d97706; border: 1px solid #fbbf24; }

/* Toast */
.toast { position: fixed; bottom: 32px; right: 32px; background: var(--text-main); color: white; padding: 14px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.toast.show { transform: translateY(0); opacity: 1; }

/* Legend */
.legend { display: flex; gap: 16px; margin-bottom: 24px; font-size: 12px; color: var(--text-muted); font-weight: 500; align-items: center; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

/* Ticketing Tool Specific */
.dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 60px 20px; text-align: center; color: var(--text-muted); transition: all 0.2s; background: #f8fafc; cursor: pointer; }
.dropzone.dragover { border-color: var(--primary); background: rgba(59,130,246,0.05); }

@media(max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .main { margin-left: 0; }
  .summary-panel { flex-wrap: wrap; gap: 16px; top: 60px; }
  .summary-actions { width: 100%; justify-content: space-between; }
  .toolbar-row { flex-direction: column; align-items: flex-start; }
  .table-search { width: 100%; }
}
</style>
</head>

// --- APP STATE & SMART CART LOGIC ---
let selectedCharges = [];
let activeTab = 'penal'; 

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getStars(num) {
  if (num === 0) return "-";
  return '⭐'.repeat(num > 5 ? 5 : num);
}

function toggleCharge(code, reason, fine, time, stars, trElement) {
  const index = selectedCharges.findIndex(c => c.code === code);
  if(index > -1) {
    selectedCharges.splice(index, 1);
    trElement.classList.remove('selected');
  } else {
    selectedCharges.push({code, reason, fine, time, stars});
    trElement.classList.add('selected');
  }
  updateSummaryPanel();
}

function updateSummaryPanel() {
  const chargesCount = selectedCharges.length;
  let totalFine = 0; let totalTime = 0; let totalStars = 0;
  let labels = [];
  
  selectedCharges.forEach(c => {
    totalFine += c.fine; totalTime += c.time; totalStars += c.stars;
    labels.push(c.code);
  });
  
  if (totalStars > 5) totalStars = 5;

  document.getElementById('sum-charges').textContent = chargesCount === 0 ? "None" : chargesCount + " Selected";
  document.getElementById('sum-fines').textContent = "$" + totalFine.toLocaleString();
  document.getElementById('sum-time').textContent = totalTime;
  document.getElementById('sum-stars').textContent = totalStars;
  document.getElementById('sum-list').textContent = labels.length ? labels.join(", ") : "Select charges from the table below.";
}

function generateDiscordReport() {
  if(selectedCharges.length === 0) return showToast("No charges selected!");
  const suspect = prompt("Enter Suspect ID or Name:", "Unknown") || "Unknown";
  
  let totalFine = 0; let totalTime = 0; let totalStars = 0;
  let report = `**ARREST REPORT**\n**Suspect:** \`${suspect}\`\n\n**Charges Filed:**\n`;
  
  selectedCharges.forEach(c => {
    totalFine += c.fine; totalTime += c.time; totalStars += c.stars;
    report += `> **${c.code}** - ${c.reason}\n`;
  });
  
  report += `\n**Total Fine:** \`$${totalFine.toLocaleString()}\`\n**Total Time:** \`${totalTime} Months\`\n**Wanted Level:** \`${totalStars > 5 ? 5 : totalStars} Stars\``;
  
  navigator.clipboard.writeText(report).then(() => showToast("Discord Report Copied!"));
}

function clearCart() {
  selectedCharges = [];
  document.querySelectorAll('.table tr.selected').forEach(el => el.classList.remove('selected'));
  updateSummaryPanel();
  showToast("Charges cleared.");
}

function filterTables(val) {
  const query = val.toLowerCase();
  document.querySelectorAll('.table tbody tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(query) ? '' : 'none';
  });
}

// --- RENDERING ---
function renderPatrolGuide(tab) {
  activeTab = tab;
  const dataToRender = tab === 'penal' ? penalCodeStructure : trafficCodeStructure;
  
  let html = `
    <div class="module-tabs">
      <div class="module-tab active">Penal & Traffic Codes</div>
      <div class="module-tab" onclick="go('arrest')">Arrest Procedure (10-15)</div>
      <div class="module-tab" onclick="go('ticketing')">Vehicle Ticketing Tool</div>
    </div>
    
    <div class="summary-panel">
      <div class="summary-block" style="min-width:120px;">
        <span class="summary-label">Charges</span>
        <span class="summary-value" id="sum-charges">None</span>
        <span class="charge-list-preview" id="sum-list">Select charges from the table below.</span>
      </div>
      <div class="summary-block" style="min-width:100px;">
        <span class="summary-label">Fines</span>
        <span class="summary-value money" id="sum-fines">$0</span>
      </div>
      <div class="summary-block" style="min-width:80px;">
        <span class="summary-label">Time</span>
        <span class="summary-value" style="color:var(--danger);" id="sum-time">0</span>
      </div>
      <div class="summary-block" style="min-width:80px;">
        <span class="summary-label">Stars</span>
        <span class="summary-value" style="color:var(--warning);" id="sum-stars">0</span>
      </div>
      <div class="summary-actions">
        <button class="btn" onclick="clearCart()">Clear</button>
        <button class="btn btn-primary" onclick="generateDiscordReport()">Copy Report</button>
      </div>
    </div>
    
    <div class="toolbar-row">
      <div class="sub-tabs">
        <button class="sub-tab ${tab === 'penal' ? 'active' : ''}" onclick="go('patrol', 'penal')">Penal Code</button>
        <button class="sub-tab ${tab === 'traffic' ? 'active' : ''}" onclick="go('patrol', 'traffic')">Traffic Code</button>
      </div>
      <div class="table-search">
        <span style="color:var(--text-muted); margin-right:8px;">⌕</span>
        <input type="text" placeholder="Search by code or description..." onkeyup="filterTables(this.value)">
      </div>
    </div>
    
    <div class="legend">
      <strong>LEGEND:</strong>
      <span class="legend-item"><div class="dot" style="background:#f59e0b;"></div> No Bailout</span>
      <span class="legend-item"><div class="dot" style="background:#ef4444;"></div> Revocation (Driver)</span>
      <span class="legend-item"><div class="dot" style="background:#10b981;"></div> Revocation (Gun)</span>
    </div>
  `;

  dataToRender.forEach(group => {
    html += `
      <div class="article-group">
        <div class="article-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
          <span>${group.article}</span> <span>▼</span>
        </div>
        <div style="display:block;">
          <table class="table">
            <thead>
              <tr><th width="40"></th><th>Code</th><th>Charges</th><th>Fine</th><th>Time (Months)</th><th>Stars</th></tr>
            </thead>
            <tbody>
    `;
    group.charges.forEach(r => {
      const isSelected = selectedCharges.some(c => c.code === r[0]);
      let tags = "";
      if (r[5] === "No Bail") tags += `<span class="tag tag-yellow">No Bail</span>`;
      if (r[5] === "Revoke Driver") tags += `<span class="tag tag-red">Rev. Driver</span>`;
      if (r[5] === "Revoke Gun") tags += `<span class="tag" style="background:#d1fae5; color:#059669; border:1px solid #10b981;">Rev. Gun</span>`;

      html += `<tr class="${isSelected ? 'selected' : ''}" onclick="toggleCharge('${r[0]}', '${r[1].replace(/'/g,"\\'")}', ${r[2]}, ${r[3]}, ${r[4]}, this)">
        <td><div class="cb-wrapper"><div class="cb-custom"></div></div></td>
        <td class="code-badge">${r[0]}</td>
        <td>${r[1]} ${tags}</td>
        <td class="money">$${r[2].toLocaleString()}</td>
        <td>${r[3] === 0 ? "-" : r[3]}</td>
        <td class="stars">${getStars(r[4])}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  return html;
}

function renderArrestSteps() {
  let html = `<div style="max-width:800px;">
    <h1 style="margin-top:0;">Arrest Procedure (10-15)</h1>
    <p style="color:var(--text-muted); margin-bottom:32px;">Complete 15-step protocol extracted from the official Full Arrest Process guide. Click 'Copy Script' to easily paste lines into game chat.</p>`;
  procedureData.forEach(s => {
    html += `<div class="step">
      <h3>${s[0]} <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="navigator.clipboard.writeText('${s[2].replace(/'/g,"\\'")}'); showToast('Script Copied!');">COPY SCRIPT</button></h3>
      <p>${s[1]}</p>
      ${s[2] ? `<div class="quote">💬 ${s[2]}</div>` : ''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderTicketingTool() {
  return `<div style="max-width:900px;">
    <h1 style="margin-top:0;">Vehicle Ticketing Tool</h1>
    <p style="color:var(--text-muted); margin-bottom:32px;">Upload or paste a screenshot of a vehicle's plate. The system will use OCR to extract the license plate automatically.</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
      <div class="article-group" style="padding:24px;">
        <input type="file" id="fileInput" style="display:none;" accept="image/*">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:32px; margin-bottom:10px;">📸</div>
          <h3 style="margin:0 0 5px; color:var(--text-main);">Drop screenshot here</h3>
          <p style="margin:0; font-size:12px;">Drag & drop • Paste with Ctrl+V</p>
        </div>
      </div>
      <div class="article-group" style="padding:24px;" id="extracted-content">
        <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:var(--text-muted); text-align:center;">
          <span style="font-size:24px; margin-bottom:10px;">🚙</span> Results will appear here.
        </div>
      </div>
    </div>
  </div>`;
}

function attachTicketingListeners() {
  const dropzone = document.getElementById('dropzone');
  if(!dropzone) return;
  
  async function handleImageUpload(file) {
    const panel = document.getElementById('extracted-content');
    if(!file.type.startsWith('image/')) return;
    panel.innerHTML = `<div style="text-align:center; padding-top:40px; color:var(--text-muted);">Analyzing image...<br><small>Please wait</small></div>`;
    try {
      const result = await Tesseract.recognize(file, 'eng');
      const plateMatch = result.data.text.match(/\b[A-Z0-9]{2,8}\b/);
      const possiblePlate = plateMatch ? plateMatch[0] : '';
      panel.innerHTML = `
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">License Plate</label><input type="text" id="t-plate" value="${possiblePlate}" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">Violation Code</label><input type="text" id="t-reason" placeholder="e.g. T.C. 6.2.A" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <div style="margin-bottom:12px;"><label style="font-size:11px; font-weight:700; color:var(--text-muted);">Fine Amount</label><input type="text" id="t-fine" placeholder="e.g. 5000" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; margin-top:4px;"></div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:10px;" onclick="navigator.clipboard.writeText('VEHICLE TICKET\\nPlate: '+document.getElementById('t-plate').value+'\\nCode: '+document.getElementById('t-reason').value+'\\nFine: $'+document.getElementById('t-fine').value); showToast('Ticket Copied!');">Copy Ticket</button>
      `;
    } catch(e) { panel.innerHTML = `<div style="color:var(--danger); text-align:center; padding-top:40px;">OCR Failed.</div>`; }
  }

  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if(e.dataTransfer.files.length) handleImageUpload(e.dataTransfer.files[0]); });
  document.getElementById('fileInput').addEventListener('change', (e) => { if(e.target.files.length) handleImageUpload(e.target.files[0]); });
  document.addEventListener('paste', (e) => { if (document.getElementById('dropzone')) { const items = (e.clipboardData || e.originalEvent.clipboardData).items; for (let i in items) { if (items[i].kind === 'file') handleImageUpload(items[i].getAsFile()); } } });
}

// --- ROUTING ---
function go(page, tab = 'penal') {
  const c = document.getElementById('content');
  const title = document.getElementById('topTitle');
  
  if (page === 'home') { title.textContent = 'Dashboard'; c.innerHTML = `<h1>Welcome Officer.</h1><p>Select a tool from the sidebar to begin processing.</p>`; }
  else if (page === 'patrol') { title.textContent = 'Patrolman\'s Guide'; c.innerHTML = renderPatrolGuide(tab); setTimeout(updateSummaryPanel, 50); }
  else if (page === 'arrest') { title.textContent = 'Arrest Procedure'; c.innerHTML = renderArrestSteps(); }
  else if (page === 'ticketing') { title.textContent = 'Vehicle Ticketing Tool'; c.innerHTML = renderTicketingTool(); setTimeout(attachTicketingListeners, 100); }
  else { title.textContent = 'Reference Library'; c.innerHTML = `<h1>Under Construction</h1><p>This reference section is currently being updated.</p>`; }
  
  window.scrollTo(0,0);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeNav = document.querySelector(`.nav-item[onclick*="'${page}'"]`);
  if (activeNav) activeNav.classList.add('active');
  
  // Mobile responsive sidebar close
  if(window.innerWidth <= 900) { document.getElementById('sidebar').style.transform = 'translateX(-100%)'; }
}

// Init
go('patrol');

// Mobile Menu Fix
document.addEventListener('click', (e) => {
  const sb = document.getElementById('sidebar');
  if(window.innerWidth <= 900 && sb.style.transform === 'translateX(0px)' && !sb.contains(e.target) && e.target.id !== 'mobileMenu') {
    sb.style.transform = 'translateX(-100%)';
  }
});
