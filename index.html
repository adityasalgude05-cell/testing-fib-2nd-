<!doctype html>
<html lang="en" data-dark="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grand RP Police Wiki — Unified wiki database and operational utility console.">
<title>Grand RP Police Wiki</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  /* Default Dark Mode (Rangrove Style) */
  --bg: #09090b; 
  --panel: #18181b; 
  --panel2: #27272a; 
  --text: #f4f4f5; 
  --muted: #a1a1aa;
  --line: #27272a; 
  --sidebar: #09090b; 
  --hover-bg: #27272a;
  --accent: #3b82f6; 
  --accent-hover: #2563eb;
  --radius: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
button, input { font: inherit; }

.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; background: var(--sidebar); border-right: 1px solid var(--line); padding: 24px 16px; overflow-y: auto; z-index: 20; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 30px; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: grid; place-items: center; font-weight: 800; color: #fff; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
.brand strong { font-size: 16px; letter-spacing: -0.02em; }
.brand small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }

.nav-title { padding: 16px 12px 8px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.nav button { width: 100%; border: 0; background: transparent; color: var(--muted); padding: 10px 12px; border-radius: 8px; text-align: left; display: flex; gap: 12px; align-items: center; cursor: pointer; margin: 2px 0; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.nav button:hover { background: var(--hover-bg); color: var(--text); }
.nav button.active { background: rgba(59,130,246,0.1); color: var(--accent); font-weight: 600; }
.nav .ico { width: 20px; text-align: center; font-size: 16px; }

/* Main Area & Topbar */
.main { margin-left: 280px; width: calc(100% - 280px); display: flex; flex-direction: column; }
.topbar { height: 70px; background: rgba(9,9,11,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 10; }

.search { position: relative; width: 300px; }
.search input { width: 100%; padding: 10px 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); outline: none; font-size: 14px; transition: border 0.2s; }
.search input:focus { border-color: var(--accent); }
.search span.icon { position: absolute; left: 14px; top: 10px; color: var(--muted); }
.kbd { position: absolute; right: 10px; top: 8px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; color: var(--muted); font-size: 10px; background: var(--bg); }

/* IC / OOC Clocks */
.top-actions { display: flex; align-items: center; gap: 20px; }
.clocks { display: flex; gap: 16px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; }
.clock-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
.clock-time { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

/* Content Grid */
.content { max-width: 1200px; margin: 0 auto; padding: 40px 32px; width: 100%; flex: 1; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.hero { margin-bottom: 30px; }
.hero h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
.hero p { margin: 0; color: var(--muted); font-size: 15px; }

/* Cards & Tables */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-body { padding: 24px; }

.tablewrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; text-align: left; }
.table th { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.table td { padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover { background: var(--hover-bg); }

.copy-btn { padding: 6px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; font-weight: 600; text-transform: uppercase; display: inline-flex; justify-content: center; align-items: center; }
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

.rule { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: var(--bg); }
.rule summary { padding: 14px 16px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; list-style: none; }
.rule summary::-webkit-details-marker { display: none; }
.rule .desc { padding: 0 16px 16px; font-size: 13px; color: var(--muted); line-height: 1.6; }

.badge { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: rgba(59,130,246,0.15); color: var(--accent); font-weight: 700; white-space: nowrap; }

.step { border-left: 2px solid var(--accent); padding-left: 20px; margin-bottom: 24px; position: relative; }
.step::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--panel); }
.step h3 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.step p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.quote { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 13px; font-family: monospace; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }

.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
.toast.show { transform: translateY(0); opacity: 1; }

.mobilebtn { display: none; background: transparent; border: 1px solid var(--line); color: var(--text); width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; }

@media(max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
  .main { margin-left: 0; width: 100%; }
  .mobilebtn { display: block; }
  .top-actions { gap: 10px; }
  .search { display: none; } /* Hide search on mobile header to save space */
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">GW</div>
    <div><strong>Grand Wiki</strong><small>Unified Utility Console</small></div>
  </div>
  <div class="nav" id="nav">
    <div class="nav-title">Menu</div>
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Home</button>
    <button data-page="arrest"><span class="ico">⚖️</span>Arrest Procedure Tool</button>
    <button data-page="traffic-stop"><span class="ico">🚔</span>Traffic Stops (10-51)</button>
    <button data-page="penal"><span class="ico">📖</span>Penal Code Tool</button>
    <button data-page="traffic"><span class="ico">🚗</span>Traffic & Parking</button>
    
    <div class="nav-title">Reference</div>
    <button data-page="general"><span class="ico">📜</span>Server Rules</button>
    <button data-page="state"><span class="ico">🏢</span>State Rules</button>
    <button data-page="ghetto"><span class="ico">💀</span>Ghetto & Captures</button>
    <button data-page="green"><span class="ico">🛡️</span>Green Zones</button>
    <button data-page="events"><span class="ico">🎯</span>Events Guide</button>
    <button data-page="terms"><span class="ico">💬</span>RP Terminology</button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="mobilebtn" id="mobileMenu">☰</button>
    <div class="search">
      <span class="icon">⌕</span>
      <input id="searchInput" placeholder="Search guides, rules, codes..." autocomplete="off">
      <span class="kbd">Ctrl K</span>
    </div>
  </div>
  <div class="top-actions">
    <div class="clocks">
      <div class="clock">
        <span class="clock-label">IC TIME</span>
        <span class="clock-time" id="ic-time">00:00:00</span>
      </div>
      <div class="clock">
        <span class="clock-label">OOC TIME</span>
        <span class="clock-time" id="ooc-time">00:00:00</span>
      </div>
    </div>
  </div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal" id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; padding:10vh 20px; align-items:flex-start; justify-content:center;">
  <div style="background:var(--panel); width:100%; max-width:600px; border-radius:12px; border:1px solid var(--line); overflow:hidden;">
    <input id="modalSearch" placeholder="Type to search..." style="width:100%; padding:20px; border:none; border-bottom:1px solid var(--line); background:var(--bg); color:var(--text); font-size:16px; outline:none;">
    <div id="results" style="max-height:60vh; overflow-y:auto; padding:10px;"></div>
  </div>
</div>
<div id="toast" class="toast">Copied to clipboard!</div>

<script>
// ---------- CLOCK LOGIC (IC & OOC) ----------
function updateClocks() {
  const now = new Date();
  // OOC TIME = Local Time
  document.getElementById('ooc-time').textContent = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  // IC TIME = Server Time (Usually UTC)
  document.getElementById('ic-time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'UTC', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(updateClocks, 1000);
updateClocks();

// ---------- DATA OBJECTS ----------
const rules = {
  general: {
    title: "Server Rules", sub: "Official Grand RP server rules and regulations.",
    groups: [
      ["Account Rules", [
        ["1.1", "Created account is property of the creator, your account cannot be shared or traded.", "PERMANENT BAN"],
        ["1.4", "It is forbidden to have more than 1 additional account (Twinking).", "Permanent ban to all except main (60 days)"],
        ["1.6", "The attempt to sell/buy game property for real money is prohibited.", "PERMANENT BAN"],
        ["1.7", "Forbidden to transfer property as a gift exceeding $5,000,000 per day.", "Ban 60 days"],
        ["1.8", "Prohibited to interact between your main account and twink.", "PERMANENT BAN"]
      ]],
      ["Rules of Play", [
        ["6.2", "Forbidden to leave RP situation (refusing first aid, leaving game, AFK, interior).", "WARN"],
        ["6.6", "Forbidden to heal and loot in the gunfight.", "Jail 60 min"],
        ["6.13", "Restricted to kill person who is unconscious to help him avoid RP (Mercy killing).", "Demorgan 120 min / WARN"],
        ["6.15", "Outside GHETTO you must engage in RP before shooting (e.g. demands within 5 secs).", "WARN"]
      ]]
    ]
  },
  state: {
    title: "State Rules", sub: "Regulations for State Organizations (LSPD, SAHP, FIB, NG, GOV).",
    groups: [
      ["General State", [
        ["1.14", "You have 25 minutes to put a person in jail starting from cuffing moment.", "Demorgan 120 min"],
        ["1.15", "Looting in a gun fight is forbidden for state employees.", "Demorgan 120 min"]
      ]],
      ["LSPD / SAHP / FIB", [
        ["5.2", "Cannot stop a person, search him or ask for passport without an IC reason.", "WARN"],
        ["5.4", "Cannot arrest a person while gunfight is not finished.", "Verbal Warning"],
        ["5.6", "Require to have a bodycam for each arrest.", "Verbal Warning"],
        ["5.8", "Forbidden to remove masks from critically wounded criminals.", "Demorgan 300 min"]
      ]]
    ]
  },
  ghetto: {
    title: "Ghetto & Captures", sub: "Gang and territory rules.",
    groups: [
      ["Ghetto Rules", [
        ["1.2", "On HQ of a gang, you are required to do all requirements of the gang.", "WARN"],
        ["1.8", "Allowed to rob/kidnap people only in ghetto or outside the city.", "WARN"],
        ["1.12", "If a person complies with given demands it's not allowed to kill them.", "Jail 120 min"]
      ]],
      ["Capture Rules", [
        ["2.1", "Capture is an OOC situation. State employees cannot interrupt.", "WARN"],
        ["2.18", "Forbidden to heal and loot in the gunfight.", "WARN"],
        ["2.29", "Forbidden to go into the interior during capture.", "Demorgan 120 min"]
      ]]
    ]
  }
};

const procedure = [
  ["Phase 1: Cuffing & Securing", "Always holster your weapon! Demand 3 times to stop moving. Cuff suspect and inform them.", "Sir/Ma'am I am placing you in cuffs. I am grabbing you by the arm, follow me."],
  ["Phase 2: Placing in Vehicle", "Tell suspect to 'Watch their head'. Inform them of charges. Radio dispatch.", "(BADGE) To Dispatch, show me 10-17 to DOC with (NUMBER) of 10-15."],
  ["Phase 3: Transport & Miranda Rights", "Drive safely. Read Miranda rights. If ignored, repeat up to 3 times.", "You have the right to remain silent. Anything you say can be used against you..."],
  ["Phase 4: Legal Requests", "Pause 25 min timer if lawyer requested. Remove mask for ID before lawyer arrives.", "(BADGE) To Dispatch, my 10-15 requests a state lawyer at DOC."],
  ["Phase 5: Arrival at DOC & Medical", "Give medical attention if needed. Ask for jumpsuit size.", "Sir/Mam, what size jumpsuit are you? *grabs jumpsuit*"],
  ["Phase 6: Searching & Confiscation", "Escort to cell. Lock doors. Search and seize illegal items. Take photo for logs.", "*Reaches into pockets for passport and illegal items*"],
  ["Phase 7: Charges & Imprisonment", "Use PDA to issue wanted level and fines. Place in cell. Update dispatch.", "(BADGE) to dispatch, my last 10-15 is 10-99 and I am 10-19."]
];

const trafficStop = [
  ["Step 1: Activate Radar", "Flex J muscle -> Turn On Radar. Check vehicle speed."],
  ["Step 2: Issue Stop Notification", "Send Stop Notification. Give 3 demands (5s between each). Speed Limits: City 120 km/h, Highway 180 km/h."],
  ["Step 3: Vehicle Stop Compliance", "If stopped: Turn off engine, exit. If fleeing: Block engine. If fighting: Neutralize."],
  ["Step 4: Initial Radio Dispatch", "Call dispatch once driver exits.", "(BADGE) show me 10-51 on a [vehicle]. Code 4 at [location]."],
  ["Step 5: Contact Phase", "Place barricade behind patrol car. Approach driver, ask for passport.", "(BADGE) We are Code 6 now."]
];

const penal = [
  ["2.1.1","Possession of Narcotics (< 4 Units)","$15,000","0","0"],
  ["2.1.2","Possession of Narcotics (5-9 Units)","$20,000","30","2"],
  ["2.1.3","Narcotics Intent to Distribute","$30,000","45","3"],
  ["2.2.2","Murder or Attempted Murder","$40,000","60","4"],
  ["2.5.1","Kidnapping / Attempted Kidnapping","$30,000","45","3"],
  ["2.5.3","Kidnapping a LEO","$50,000","75","5"],
  ["2.9.4","Grand Theft Auto","$40,000","60","4"],
  ["2.10","Armed Robbery","$40,000","60","4"],
  ["2.17.1","Unlicensed Firearms Carry","$10,000","0","0"],
  ["2.17.3","Possession of Illegal Firearms","$20,000","30","2"],
  ["2.24.2","Evading Arrest","$40,000","60","4"],
  ["3.1.1","Terrorism","$40,000","60","4"],
  ["3.6.2","Attempted Murder of Civil Servant/LEO","$50,000","75","5"]
];

const traffic = [
  ["2.1","Absence of Valid Licence Plate","$5,000","0","0"],
  ["3.2.1","Driving the Opposite Lane","$10,000","0","0"],
  ["3.2.2","Opposite Lane on Highway","$15,000","30","2"],
  ["3.5.2","Chaotic Movement Between Lanes","$5,000","0","0"],
  ["3.6","Driving Under Influence","$20,000","30","2"],
  ["5.5","Abandoning a Vehicle","$5,000","0","0"]
];

const eventsData = {
  "Ghetto Patrol": ["Heavy Weapons allowed.", "Min 8-10 Units (4 cars).", "Must be in ghetto for 15+ mins.", "Halt 5 mins in Fake Parking."],
  "Store Robbery": ["Don't shoot outside perimeter from inside.", "Don't shoot without demands.", "Heavy Weapons NOT allowed."],
  "FZ Raid": ["Heavy Weapons NOT allowed.", "Accessing roof NOT allowed.", "Leave base after raid."],
  "Submarine / Prison": ["Heavy Weapons NOT allowed.", "Standard protection protocols apply."]
};

// ---------- UI RENDERING ----------
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

function renderDashboard(){
  return `<div class="hero">
    <h1>Good Evening, Officer</h1>
    <p>Unified wiki database and operational utility console for Grand RP.</p>
  </div>
  <div class="card"><div class="card-head"><h2>Quick Action Tools</h2></div><div class="card-body" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:16px;">
    <div style="padding:20px; border:1px solid var(--line); border-radius:8px; cursor:pointer;" onclick="go('arrest')">
      <h3 style="margin:0 0 8px; color:var(--accent);">Arrest Procedure (10-15)</h3><p style="margin:0; font-size:13px; color:var(--muted);">Step-by-step commands and scripts.</p>
    </div>
    <div style="padding:20px; border:1px solid var(--line); border-radius:8px; cursor:pointer;" onclick="go('penal')">
      <h3 style="margin:0 0 8px; color:var(--accent);">Penal Code</h3><p style="margin:0; font-size:13px; color:var(--muted);">Search and copy charges instantly.</p>
    </div>
    <div style="padding:20px; border:1px solid var(--line); border-radius:8px; cursor:pointer;" onclick="go('traffic-stop')">
      <h3 style="margin:0 0 8px; color:var(--accent);">Traffic Stop (10-51)</h3><p style="margin:0; font-size:13px; color:var(--muted);">Standard protocol for pull-overs.</p>
    </div>
  </div></div>`;
}

function renderTable(title, sub, cols, data, prefix="") {
  let html = `<div class="hero"><h1>${title}</h1><p>${sub}</p></div><div class="card"><div class="card-body tablewrap"><table class="table"><thead><tr>`;
  cols.forEach(c => html += `<th>${c}</th>`);
  html += `<th>Action</th></tr></thead><tbody>`;
  data.forEach(r => {
    let copyStr = `${prefix}${r[0]} - ${r[1]}`;
    html += `<tr>`;
    r.forEach((v, i) => html += `<td ${i===0?'style="color:var(--accent); font-weight:700;"':''}>${v}</td>`);
    html += `<td><button class="copy-btn" onclick="copyToClipboard('${esc(copyStr)}')">COPY</button></td></tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderRules(key) {
  if(!rules[key]) return renderDashboard();
  let html = `<div class="hero"><h1>${rules[key].title}</h1><p>${rules[key].sub}</p></div>`;
  rules[key].groups.forEach(g => {
    html += `<div class="card"><div class="card-head"><h2>${g[0]}</h2><span class="badge">${g[1].length} Rules</span></div><div class="card-body">`;
    g[1].forEach(r => {
      html += `<details class="rule"><summary><span style="color:var(--accent); width:50px;">${r[0]}</span> <span style="flex:1;">${r[1]}</span></summary>`;
      if(r[2]) html += `<div class="desc"><strong>Punishment:</strong> ${r[2]}</div>`;
      html += `</details>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function renderSteps(title, sub, data) {
  let html = `<div class="hero"><h1>${title}</h1><p>${sub}</p></div><div class="card"><div class="card-body">`;
  data.forEach((s, i) => {
    let copyStr = s[2] ? s[2] : s[1];
    html += `<div class="step">
      <h3>${s[0]} <button class="copy-btn" onclick="copyToClipboard('${esc(copyStr)}')">COPY SCRIPT</button></h3>
      <p>${s[1]}</p>
      ${s[2] ? `<div class="quote">${s[2]}</div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function renderEvents() {
  let html = `<div class="hero"><h1>Event Rules</h1><p>Protocols for major server events.</p></div><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">`;
  Object.entries(eventsData).forEach(([k,v]) => {
    html += `<div class="card"><div class="card-head"><h2>${k}</h2></div><div class="card-body"><ul style="margin:0; padding-left:20px; color:var(--muted); font-size:14px; line-height:1.6;">`;
    v.forEach(li => html += `<li>${li}</li>`);
    html += `</ul></div></div>`;
  });
  html += `</div>`;
  return html;
}

function go(page) {
  const c = document.getElementById('content');
  if(page === 'dashboard') c.innerHTML = renderDashboard();
  else if(page === 'penal') c.innerHTML = renderTable("Penal Code Tool", "Search and copy PC charges.", ["Code","Crime","Fine","Time","Stars"], penal, "P.C. ");
  else if(page === 'traffic') c.innerHTML = renderTable("Traffic & Parking", "Vehicle code violations.", ["Code","Crime","Fine","Time","Stars"], traffic, "T.C. ");
  else if(page === 'arrest') c.innerHTML = renderSteps("10-15 Arrest Procedure", "Step-by-step detention guide.", procedure);
  else if(page === 'traffic-stop') c.innerHTML = renderSteps("10-51 Traffic Stop", "Standard vehicle pullover protocol.", trafficStop);
  else if(page === 'events') c.innerHTML = renderEvents();
  else c.innerHTML = renderRules(page);
  
  window.scrollTo(0,0);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('sidebar').classList.remove('open');
}

// Nav Listeners
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click', () => document.getElementById('sidebar').classList.add('open'));
document.addEventListener('click', (e) => {
  const sb = document.getElementById('sidebar');
  if(sb.classList.contains('open') && !sb.contains(e.target) && e.target.id !== 'mobileMenu') sb.classList.remove('open');
});

// Search Modal Logic (CTRL+K)
const modal = document.getElementById('modal');
const modalInput = document.getElementById('modalSearch');
document.getElementById('searchInput').addEventListener('click', () => { modal.style.display = 'flex'; modalInput.focus(); });
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); modal.style.display = 'flex'; modalInput.focus(); } else if (e.key === 'Escape') modal.style.display = 'none'; });
modal.addEventListener('click', e => { if(e.target === modal) modal.style.display = 'none'; });

// Initial Render
go('dashboard');
</script>
</body>
